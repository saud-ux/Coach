<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>جدول الحكم</title>
<meta name="theme-color" content="#1E6A43">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="جدول الحكم">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F6F2; --surface:#FFFFFF; --ink:#18201B; --muted:#5E6B63; --line:#DDE3DC;
  --pitch:#1E6A43; --pitch-soft:#E3EFE7; --card:#F2C230; --card-ink:#3B2E00; --red:#C8372D;
  --run:#1E6A43; --strength:#2F5D8A; --intervals:#B4561C; --yoyo:#7A3E9D; --light:#6E8B7A;
  --rest:#A3ADA6; --recovery:#4E9A8C; --test:#C8372D; --match:#F2C230;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101612; --surface:#18211B; --ink:#E8EEE9; --muted:#9AA9A0; --line:#2A362E;
    --pitch:#4FB57F; --pitch-soft:#1C3326; --card-ink:#2A2100; --rest:#56625A; --light:#7FA08C;
  }
}
:root[data-theme="dark"]{
  --bg:#101612; --surface:#18211B; --ink:#E8EEE9; --muted:#9AA9A0; --line:#2A362E;
  --pitch:#4FB57F; --pitch-soft:#1C3326; --card-ink:#2A2100; --rest:#56625A; --light:#7FA08C;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:"Readex Pro",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;font-size:16px;line-height:1.6;
  -webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--pitch);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding:0 16px 110px}

.brand{display:flex;align-items:center;gap:12px}
.logo{width:46px;height:46px;border-radius:14px;background:linear-gradient(160deg,#2A8456,#17543A);display:grid;place-items:center;box-shadow:0 4px 12px rgba(23,84,58,.3);flex:none}
.logo svg{width:34px;height:34px}
.brand b{display:block;font-size:20px;font-weight:700;line-height:1.2}
.brand small{display:block;font-size:12px;color:var(--muted)}
.brand .hi{margin-inline-start:auto;font-size:13px;color:var(--muted);text-align:left}
.nextm{margin-top:14px;display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 14px}
.nextm .card-ic{width:22px;height:30px;border-radius:4px;background:var(--card);transform:rotate(-8deg);box-shadow:0 2px 6px rgba(0,0,0,.15);flex:none}
.nextm .big{font-size:26px;font-weight:700;color:var(--pitch);line-height:1}
.nextm .tx{font-size:14px;line-height:1.35}
.nextm .tx small{display:block;color:var(--muted);font-size:12px}
.nextm.none .card-ic{background:var(--line)}
.hero{margin-top:14px;border-radius:22px;padding:18px;color:#fff;background:linear-gradient(155deg,var(--hc,#1E6A43),color-mix(in srgb,var(--hc,#1E6A43) 55%,#000));position:relative;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.12)}
.hero::after{content:"";position:absolute;inset:auto -40px -60px auto;width:180px;height:180px;border-radius:50%;border:26px solid rgba(255,255,255,.08)}
.hero .lbl{font-size:13px;opacity:.85}
.hero h2{margin:4px 0 6px;font-size:23px;line-height:1.3}
.hero .ty{display:inline-block;background:rgba(255,255,255,.18);border-radius:999px;padding:3px 10px;font-size:12px}
.hero .hbtns{display:flex;gap:8px;margin-top:14px;position:relative;z-index:1}
.hero .hbtns button{border:0;border-radius:12px;padding:10px 16px;font-weight:600;font-size:15px}
.hero .go{background:#fff;color:#18201B}
.hero .ok{background:rgba(255,255,255,.18);color:#fff}
.hero.match{--hc:#D9A400;color:#2A2100}
.hero.match .ty,.hero.match .ok{background:rgba(0,0,0,.1);color:#2A2100}
.wkdots{display:flex;gap:6px;margin-top:14px;position:relative;z-index:1}
.wkdots span{flex:1;text-align:center;font-size:11px;opacity:.9}
.wkdots i{display:block;height:6px;border-radius:3px;background:rgba(255,255,255,.25);margin-bottom:4px}
.wkdots i.on{background:#fff}
.wkdots i.now{background:rgba(255,255,255,.6);outline:2px solid #fff;outline-offset:1px}
.hero.match .wkdots i{background:rgba(0,0,0,.15)} .hero.match .wkdots i.on{background:#2A2100}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button span{font-size:12px}
/* quiz, career, weather */
.qcard{margin-top:10px}
.qtag{display:inline-block;font-size:12px;background:var(--pitch-soft);color:var(--pitch);border-radius:999px;padding:2px 10px;margin-top:6px;font-weight:600}
.qref{display:block;margin-top:6px;color:var(--pitch);font-weight:600}
.qcats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.qcats button{position:relative;overflow:hidden;text-align:right;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px}
.qcats b{display:block;font-size:14px}.qcats small{display:block;font-size:12px;color:var(--muted)}
.qcats i{position:absolute;bottom:0;right:0;height:3px;background:var(--pitch)}
.pbar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin:8px 0 4px}.pbar i{display:block;height:100%;background:var(--pitch)}
.qq{font-size:15px;line-height:1.6;margin:8px 0}
.qopts{display:flex;flex-direction:column;gap:6px}
.qopts button{text-align:right;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;font-size:14px}
.qopts button.ok{border-color:var(--pitch);background:var(--pitch-soft);font-weight:600}
.qopts button.no{border-color:var(--red);background:color-mix(in srgb,var(--red) 10%,transparent)}
.qopts button:disabled{color:var(--ink)}
.qwhy{font-size:14px;line-height:1.6;background:var(--bg);border-radius:12px;padding:10px 12px;margin:10px 0 0}
.mf{border-top:1px solid var(--line);margin-top:12px;padding-top:6px}
.mf h4{margin:8px 0 0;font-size:15px}
.two{display:flex;gap:10px}.two>div{flex:1}
.in.sm{padding:6px 10px;font-size:14px}
.cm{display:flex;align-items:center;gap:10px;cursor:pointer}
.cm div{flex:1}.cm b{display:block;font-size:15px}.cm small{display:block;color:var(--muted);font-size:12px}
.cm .sc{background:var(--pitch);color:#fff;border-radius:10px;padding:4px 10px;font-weight:700}
.cm .sc.none{background:var(--bg);color:var(--muted);font-weight:400;font-size:12px}
.wx{position:relative;z-index:1;margin-top:10px;font-size:13px;background:rgba(0,0,0,.18);border-radius:10px;padding:6px 10px}
/* day list */
.wnav{display:flex;align-items:center;gap:10px;margin-top:20px}
.wbtn{width:42px;height:42px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);font-size:18px;flex:none;color:var(--ink)}
.wbtn:disabled{opacity:.3}
.wmid{flex:1;text-align:center}
.wmid b{display:block;font-size:18px}
.wmid small{display:block;font-size:12px;color:var(--muted)}
.wstrip{display:flex;gap:4px;margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:6px}
.wday{flex:1;border:0;background:none;border-radius:12px;padding:6px 0 7px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--ink)}
.wday small{font-size:11px;color:var(--muted)}
.wday b{font-size:15px}
.wday i{width:6px;height:6px;border-radius:50%}
.wday.now{background:var(--pitch);color:#fff}
.wday.now small{color:rgba(255,255,255,.8)}
.wday.dn b{text-decoration:line-through;opacity:.6}
.wday.rst b{opacity:.5}
.wprog{display:flex;align-items:center;gap:10px;margin:12px 0 10px;font-size:12px;color:var(--muted)}
.wprog .wkbar{flex:1;margin:0}
.day.flash{outline:3px solid var(--card);outline-offset:2px}
@media (prefers-reduced-motion: no-preference){
  .wlist.in-next{animation:inN .25s ease-out} .wlist.in-prev{animation:inP .25s ease-out}
  @keyframes inN{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
  @keyframes inP{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
}
.pastbtn{width:100%;margin-top:18px;border:1.5px dashed var(--line);background:none;border-radius:12px;padding:10px;color:var(--muted);font-size:14px}
.week{margin-top:22px}
.wkh{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.wkh b{display:block;font-size:17px}
.wkh small{display:block;font-size:12px;color:var(--muted)}
.wkp{font-size:14px;font-weight:600;color:var(--pitch)}
.wkbar{height:5px;border-radius:3px;background:var(--line);margin:8px 0 10px;overflow:hidden}
.wkbar i{display:block;height:100%;background:var(--pitch);border-radius:3px;transition:width .4s}
.day{display:flex;align-items:center;gap:12px;width:100%;text-align:right;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 12px;margin-bottom:8px;transition:transform .1s}
.day:active{transform:scale(.985)}
.day .dnum{width:44px;flex:none;text-align:center;line-height:1.1}
.day .dnum b{display:block;font-size:20px;font-weight:700}
.day .dnum small{display:block;font-size:11px;color:var(--muted)}
.day .dic{width:40px;height:40px;border-radius:12px;flex:none;display:grid;place-items:center;font-size:19px;background:color-mix(in srgb,var(--c) 16%,transparent);border:1.5px solid color-mix(in srgb,var(--c) 40%,transparent)}
.day .t{flex:1;min-width:0}
.day .t .ti{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.day .t .ty{font-size:12px;color:var(--muted)}
.day .tick{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:14px;color:var(--pitch);font-weight:700}
.day .tick.on{background:var(--pitch);border-color:var(--pitch);color:#fff}
.day.today{border:2px solid var(--pitch);box-shadow:0 4px 14px color-mix(in srgb,var(--pitch) 18%,transparent)}
.day.past:not(.dn){opacity:.55}
.day.dn .ti{text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--ink) 35%,transparent)}
.day.restd{background:transparent;border-style:dashed;padding:6px 12px}
.day.restd .dic{width:32px;height:32px;font-size:15px;background:none;border:0}
.day.restd .ti{font-weight:400;color:var(--muted);font-size:14px}
.day.match{background:var(--match);border-color:var(--match);color:var(--card-ink)}
.day.match .dnum small,.day.match .ty{color:var(--card-ink);opacity:.75}
.day.match .dic{background:rgba(255,255,255,.35);border-color:rgba(0,0,0,.1)}
.day.test{border-color:var(--red)}
/* sheet */
.shero{margin:-4px 0 14px;padding:18px 16px 16px;border-radius:18px;background:linear-gradient(155deg,color-mix(in srgb,var(--hc) 22%,var(--surface)),var(--surface));border:1px solid color-mix(in srgb,var(--hc) 35%,transparent)}
.shero.match{background:linear-gradient(155deg,#FFE58A,var(--surface))}
.shero .sty{display:inline-block;font-size:13px;font-weight:600;border-radius:999px;padding:3px 10px;background:color-mix(in srgb,var(--hc) 18%,transparent)}
.shero h2{margin:8px 0 2px;font-size:22px;line-height:1.3}
.shero .sub{margin-bottom:10px}
.schips{display:flex;flex-wrap:wrap;gap:6px}
.schips span{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:13px}
.dtl{margin-top:14px;background:var(--bg);border-radius:12px;padding:10px 14px}
.dtl summary{cursor:pointer;font-weight:600;font-size:15px}
.dtl .details{background:none;padding:8px 0 0}
.logcard{margin-top:14px;border:1.5px solid var(--line);border-radius:16px;padding:14px}
.logcard h3{margin:0;font-size:17px}
.exn{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--pitch);color:#fff;font-size:13px;margin-inline-end:8px;vertical-align:middle}
.dgcard{border:1px solid var(--line)}
/* header */
header.top{padding:20px 0 8px}
.count{display:flex;align-items:flex-end;gap:14px}
.count b{font-size:64px;line-height:.9;font-weight:700;color:var(--pitch);letter-spacing:-1px}
.count span{font-size:15px;color:var(--muted);padding-bottom:8px}
.count span strong{display:block;color:var(--ink);font-size:18px;font-weight:600}
.status{font-size:13px;color:var(--muted);margin-top:6px;min-height:20px}

/* tabs */
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);
  display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
nav.tabs button{flex:1;max-width:213px;background:none;border:0;padding:12px 4px 14px;font-size:15px;color:var(--muted);font-weight:500;border-top:3px solid transparent}
nav.tabs button[aria-selected="true"]{color:var(--pitch);border-top-color:var(--pitch)}
section[hidden]{display:none}

/* schedule */
.actions{display:flex;gap:10px;margin:14px 0 6px}
.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:600;font-size:15px}
.btn.primary{background:var(--pitch);color:#fff}
.btn.card{background:var(--card);color:var(--card-ink)}
.btn.ghost{background:transparent;border:1.5px solid var(--line)}
.btn.danger{background:transparent;color:var(--red);border:1.5px solid var(--red)}
.btn:disabled{opacity:.5}
.week{margin-top:22px}
.week h3{font-size:14px;font-weight:500;color:var(--muted);margin:0 0 8px}
.day{display:flex;align-items:stretch;gap:12px;width:100%;text-align:right;background:var(--surface);
  border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.day.today{border:2px solid var(--pitch)}
.day.past{opacity:.62}
.bar{width:6px;border-radius:4px;flex:none}
.day .d{flex:none;width:62px}
.day .d .wd{font-size:14px;font-weight:600}
.day .d .dt{font-size:12px;color:var(--muted)}
.day .t{flex:1;min-width:0}
.day .t .ti{font-weight:500;font-size:15px}
.day .t .ty{font-size:12px;color:var(--muted)}
.tick{flex:none;align-self:center;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:14px}
.tick.on{background:var(--pitch);border-color:var(--pitch);color:#fff}
/* match day = yellow card */
.day.match{background:var(--match);border-color:var(--match);color:var(--card-ink)}
.day.match .dt,.day.match .ty{color:var(--card-ink);opacity:.75}
.day.match .bar{background:var(--card-ink)!important;opacity:.3}
.day.test{border-color:var(--red)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.scrim[hidden]{display:none}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;
  padding:20px 18px calc(22px + env(safe-area-inset-bottom,0px))}
.sheet h2{margin:0 0 4px;font-size:21px}
.xbar{position:sticky;top:-20px;z-index:5;display:flex;justify-content:flex-end;margin:-20px -18px 0;padding:12px 12px 0;pointer-events:none}
.xclose{pointer-events:auto;width:38px;height:38px;border-radius:50%;border:0;background:var(--bg);color:var(--ink);font-size:18px;display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.sheet .sub{color:var(--muted);font-size:14px;margin-bottom:14px}
.sheet .details{white-space:pre-line;background:var(--bg);border-radius:12px;padding:12px 14px;font-size:15px}
label.f{display:block;font-size:14px;color:var(--muted);margin:14px 0 6px}
input.in,textarea.in,select.in{width:100%;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;font-size:16px}
textarea.in{min-height:70px;resize:vertical}
.scale{display:flex;gap:6px}
.scale button{flex:1;border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 2px;font-size:13px}
.scale button[aria-pressed="true"]{background:var(--pitch);border-color:var(--pitch);color:#fff}
.row{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.row .btn{flex:1}

/* chat */
#chat:not([hidden]){display:flex;flex-direction:column}
.msgs{display:flex;flex-direction:column;gap:10px;padding:10px 0 150px}
.msg{max-width:88%;padding:11px 14px;border-radius:16px;white-space:pre-line;font-size:15px}
.msg.me{align-self:flex-start;background:var(--pitch);color:#fff;border-bottom-right-radius:4px}
.msg.ai{align-self:flex-end;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg .chg{display:block;margin-top:8px;font-size:12px;color:var(--pitch);font-weight:600}
.msg.err{color:var(--red)}
.empty{color:var(--muted);font-size:15px;padding:18px 0}
.composer{position:fixed;left:0;right:0;bottom:calc(52px + env(safe-area-inset-bottom,0px));background:var(--bg);padding:8px 16px 10px;z-index:15}
.composer .in-wrap{max-width:608px;margin:0 auto}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px}
.chips button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px}
.send{display:flex;gap:8px}
.send textarea{flex:1;min-height:46px;max-height:120px}
.send .btn{flex:none}

/* progress */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.stat b{font-size:28px;font-weight:700;display:block;color:var(--pitch)}
.stat span{font-size:13px;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:14px}
.panel h3{margin:0 0 10px;font-size:17px}
.chart{width:100%;height:auto;display:block}
.tlist{margin:10px 0 0;padding:0;list-style:none;font-size:14px}
.tlist li{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.tlist button{background:none;border:0;color:var(--red);font-size:13px}
.note{font-size:13px;color:var(--muted)}
.rcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:10px}
.rcard h3{margin:0 0 4px;font-size:16px}
.coach{display:flex;flex-direction:column;gap:8px}
.chead{display:flex;align-items:center;gap:8px;font-size:15px}
.cav{width:30px;height:30px;border-radius:50%;background:var(--pitch-soft);display:grid;place-items:center;font-size:15px}
.cb{max-width:90%;padding:9px 13px;border-radius:16px;font-size:15px;line-height:1.55;animation:none}
.cb.ai{align-self:flex-start;background:var(--bg);border-bottom-right-radius:4px}
.cb.me{align-self:flex-end;background:var(--pitch);color:#fff;border-bottom-left-radius:4px}
.copts{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.copts button{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:14px;display:flex;align-items:center;gap:5px}
.copts button span{font-size:17px}
.copts button:active{background:var(--pitch-soft)}
@media (prefers-reduced-motion: no-preference){ .cb:last-of-type{animation:pop .25s ease-out} @keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}} }
.rtop{display:flex;align-items:center;gap:8px}
.rtop b{font-size:16px}
.rdot{width:12px;height:12px;border-radius:50%;flex:none}
.rpct{color:var(--muted);font-size:14px}
.lnk{margin-inline-start:auto;background:none;border:0;color:var(--pitch);font-size:14px;font-weight:600;padding:4px}
.rq{margin-top:10px}

<script>
/* standalone runtime: replaces the Claude artifact runtime on our own server */
(function(){
  if (window.claude && window.claude.use) return;
  const KEY='rc-pass';
  const getPass=()=>{ try{ return localStorage.getItem(KEY)||''; }catch(e){ return ''; } };
  async function api(path, opts={}){
    let pass=getPass();
    for (let attempt=0; attempt<3; attempt++){
      const r = await fetch(path,{...opts,headers:{'Content-Type':'application/json','X-Passcode':pass,...(opts.headers||{})}});
      if (r.status===401){ pass = prompt('اكتب رمز الدخول:')||''; try{localStorage.setItem(KEY,pass);}catch(e){} if(!pass) throw {code:'not_granted',message:'no passcode'}; continue; }
      if (r.status===429) throw {code:'rate_limited',message:'rate'};
      if (!r.ok) throw {code:'upstream_error',message:'HTTP '+r.status};
      return r.json();
    }
    throw {code:'not_granted',message:'bad passcode'};
  }
  async function toB64(blob){
    const img = await createImageBitmap(blob); const s=Math.min(1,1400/Math.max(img.width,img.height));
    const c=document.createElement('canvas'); c.width=Math.round(img.width*s); c.height=Math.round(img.height*s); c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    return c.toDataURL('image/jpeg',.85).split(',')[1];
  }
  async function call(input, opts){
    let messages = typeof input==='string' ? [{role:'user',content:input}] : input.map(m=>({role:m.role,content:m.content}));
    const imgs = opts.images ? Array.from(opts.images instanceof Blob ? [opts.images] : opts.images) : [];
    if (imgs.length){ const last=messages[messages.length-1]; const blocks=[];
      for (const b of imgs) blocks.push({type:'image',source:{type:'base64',media_type:'image/jpeg',data:await toB64(b)}});
      blocks.push({type:'text',text:last.content}); last.content=blocks; }
    const d = await api('/api/claude',{method:'POST',body:JSON.stringify({messages})});
    return {text:d.text||'', truncated:false, modelTierApplied:'default'};
  }
  const sample = async (input, opts={}) => { if (opts.signal && opts.signal.aborted) throw {code:'cancelled'}; const r = await call(input, opts); if (opts.signal && opts.signal.aborted) throw {code:'cancelled'}; if (opts.onText) opts.onText({text:r.text, delta:r.text}); return r; };
  sample.json = async (input, opts={}) => { const r = await sample(input, opts); let t=r.text.trim();
    const f=t.match(/```(?:json)?\s*([\s\S]*?)```/); if (f) t=f[1];
    try { return JSON.parse(t); } catch(e){ const s=t.search(/[\[{]/), e2=Math.max(t.lastIndexOf('}'),t.lastIndexOf(']')); try { return JSON.parse(t.slice(s,e2+1)); } catch(_){ throw {code:'invalid_json',message:'parse',text:r.text}; } } };
  sample.limits = async () => ({maxPromptBytes:65536, images:{maxCount:1,maxInputBytes:20e6,mediaTypes:['image/jpeg','image/png','image/heic','image/webp']}});
  // cloud sync through our server (Supabase behind it)
  const db = { doc: () => ({
    get: async () => { const d = await api('/api/state'); return { exists: !!(d && d.data), data: () => d.data }; },
    set: async (v) => { await api('/api/state',{method:'PUT',body:JSON.stringify({data:v})}); }
  }) };
  const user = { id: async () => 'me' };
  window.RC_INBOX = { list: () => api('/api/inbox'), remove: id => api('/api/inbox?id='+encodeURIComponent(id),{method:'DELETE'}) };
  let syncOk = null;
  async function hasSync(){ if (syncOk!==null) return syncOk; try { const r=await fetch('/api/state/enabled'); syncOk = r.ok && (await r.json()).enabled; } catch(e){ syncOk=false; } return syncOk; }
  window.claude = { use: async name => name==='sample' ? sample : name==='db' ? ((await hasSync())?db:null) : name==='user' ? ((await hasSync())?user:null) : null };
})();
if ('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));

</script>

};

• سكوات ١٥
• طعنات للخلف ١٠ لكل رجل
• سكوات برجل وحدة والثانية على كرسي ٨ لكل رجل

• بلانك جانبي ٣٠ ثانية لكل جهة`;
// first 4 weeks build up, then a repeating 4-week cycle (3 steady weeks + 1 lighter week)

function save(){
  if (!loaded) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    if (state.chat.length > 60) state.chat = state.chat.slice(-60);
    const snap = JSON.parse(JSON.stringify(state));
    if (docRef){
      saving = saving.then(() => docRef.set(snap)).then(() => setStatus('محفوظ'))
        .catch(e => setStatus(e.code==='quota_exceeded' ? 'المساحة ممتلئة' : 'تعذّر الحفظ، يُحفظ على الجهاز مؤقتًا'));

}
function adopt(data){
  if (!data || !data.sessions) return;
  state = {v:6, sessions:data.sessions, matches:data.matches||[], logs:data.logs||{}, tests:(data.tests||[]).filter(x=>x.kind==='cooper'), chat:data.chat||[], readiness:data.readiness||{}, reports:data.reports||{}, quiz:data.quiz||{answers:{},daily:{}}, settings:data.settings||{city:'zulfi'}};
  if ((data.v||1) < 6){
    // plan template changed: replace every upcoming non-match day with the ongoing plan
    const t = todayISO();
    Object.keys(state.sessions).forEach(d => { if (d >= t && state.sessions[d].type !== 'match') delete state.sessions[d]; });
    ensureHorizon();
    state.matches.filter(m => m.date >= t).forEach(m => applyMatch(m.date, m.time, m.note));
  }
}
async function initStorage(){
  let local = null;
  try { local = JSON.parse(localStorage.getItem(LS) || 'null'); } catch(e){}
  try {
    const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
    const uid = user ? await user.id() : null;
    if (db && uid){
      docRef = db.doc(`data/users/${uid}/state`);
      const snap = await docRef.get();
      if (snap.exists) adopt(snap.data());
      else if (local) adopt(local);
      setStatus('محفوظ في حسابك');
    } else { if (local) adopt(local); setStatus('محفوظ على هذا الجهاز'); }

/* ---------- matches ---------- */
function applyMatch(date, time, note){
  const id = 'm' + Date.now().toString(36) + Math.random().toString(36).slice(2,5);
  state.matches = state.matches.filter(m => m.date !== date);
  state.matches.push({id,date,time:time||'',note:note||''});
  state.sessions[date] = {type:'match',title:'مباراة'+(time?` الساعة ${time}`:''),details:(note?note+'\n':'')+'اشرب ٥٠٠ مل قبلها بساعتين، ورشفات بين الشوطين، وأملاح إذا الجو حار.'};
  const after = addDays(date,1), before = addDays(date,-1);
  const a = state.sessions[after];
  if (a && a.type!=='match' && a.type!=='test' && a.type!=='rest')
    state.sessions[after] = {type:'recovery',title:'استشفاء بعد المباراة',details:'مشي ٢٠–٣٠ دقيقة وإطالات. لا تمرين قوي.'};
  const b = state.sessions[before];
  if (b && HARD.has(b.type) && b.type!=='test')

  state.matches = state.matches.filter(m => m.date !== date);

/* ---------- progress ---------- */
function chart(points, unit){
  if (points.length < 2) return `<p class="note">${points.length? 'سجّل نتيجة ثانية عشان يظهر الرسم.' : 'ما فيه نتائج بعد.'}</p>`;
  const W=560,H=160,P=28, vals=points.map(p=>p.value), mn=Math.min(...vals), mx=Math.max(...vals), span=(mx-mn)||1;
  const xs=i=>P+(W-2*P)*i/(points.length-1), ys=v=>H-P-(H-2*P)*(v-mn)/span;
  // RTL: newest on the left
  const pts=points.map((p,i)=>`${W-xs(i)},${ys(p.value)}`).join(' ');
  const dots=points.map((p,i)=>`<circle cx="${W-xs(i)}" cy="${ys(p.value)}" r="5" fill="var(--pitch)"/><text x="${W-xs(i)}" y="${ys(p.value)-10}" text-anchor="middle" font-size="13" fill="var(--ink)">${num(p.value)}</text>`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="تطور ${unit}"><polyline points="${pts}" fill="none" stroke="var(--pitch)" stroke-width="3" stroke-linejoin="round"/>${dots}</svg>`;
}
function renderProgress(){
  const t = todayISO(), sun = addDays(t,-parse(t).getDay());
  const trainDays = Object.entries(state.sessions).filter(([d,s]) => d<=t && !['rest','match'].includes(s.type));
  const doneAll = trainDays.filter(([d]) => state.logs[d]?.done).length;
  const wk = trainDays.filter(([d]) => d>=sun);
  const wkDone = wk.filter(([d]) => state.logs[d]?.done).length;
  const played = state.matches.filter(m => m.date<=t).length;
  const pct = trainDays.length ? Math.round(100*doneAll/trainDays.length) : 0;
  $('stats').innerHTML = `
    <div class="stat"><b>${num(wkDone)}/${num(wk.length)}</b><span>تمارين هذا الأسبوع</span></div>
    <div class="stat"><b>${num(pct)}٪</b><span>الالتزام منذ البداية</span></div>
    <div class="stat"><b>${num(doneAll)}</b><span>تمارين أنهيتها</span></div>
    <div class="stat"><b>${num(played)}</b><span>مباريات حكمتها</span></div>`;
  ['cooper'].forEach(k => {

/* ---------- training load ---------- */
const RPE = [0,2,4,6,8,10];
function defDur(d,s){ if(!s) return 0; if(s.type==='run') return weekParams(d).run; return ({strength:35,intervals:35,yoyo:40,light:20,recovery:25,rest:0,test:25,match:105})[s.type] ?? 30; }
function dayLoad(d){ const l=state.logs[d]; if(!l||!l.done) return 0; const dur = l.dur ?? defDur(d,state.sessions[d]); return dur*RPE[l.effort||3]; }
function sumLoad(from,to){ let s=0,d=from; while(d<=to){ s+=dayLoad(d); d=addDays(d,1);} return s; }
function loadStatus(){
  const t=todayISO(), acute=sumLoad(addDays(t,-6),t), chronic=sumLoad(addDays(t,-27),t)/4;
  const first=Object.keys(state.logs).filter(d=>state.logs[d].done).sort()[0];
  const enough=!!first && (parse(t)-parse(first))/864e5>=14;
  const ratio=chronic>0?acute/chronic:null;
  let lbl='بيانات غير كافية', cls='grn';
  if (enough && ratio!=null){ if(ratio>1.5){lbl='خطر إرهاق';cls='red';} else if(ratio>1.3){lbl='انتبه';cls='yel';} else if(ratio>=0.8){lbl='منطقة آمنة';cls='grn';} else {lbl='حمل منخفض';cls='yel';} }
  return {acute,chronic,ratio,enough,lbl,cls};
}
const LEGS=['','مرتاحة','خفيفة','متوسطة','ثقيلة','منهكة'], WEA=['','معتدل','حار','حار ورطب'], HALF=['','ما تعبت','تعب بالشوط الأول','تعب بالشوط الثاني'];

const RQ=[['sleep','النوم',['سيء جدًا','سيء','عادي','زين','ممتاز']],['sore','ألم العضلات',['شديد','واضح','خفيف','بسيط','ما فيه']],['energy','الطاقة',['منهك','تعبان','عادي','نشيط','ممتاز']]];
const readyScore = r => (r.sleep+r.sore+r.energy)/3;
const readyLabel = sc => sc>=4?['جاهز تمامًا','var(--pitch)']:sc>=3?['جاهزية متوسطة','#C99A1E']:['جاهزية منخفضة','var(--red)'];
function lighten(d, toRecovery){
  const s=state.sessions[d]; if(!s||!HARD.has(s.type)||s.type==='test') return;
  const orig={type:s.type,title:s.title,details:s.details};
  state.sessions[d] = toRecovery
    ? {type:'recovery',title:'استشفاء (جاهزيتك منخفضة)',details:'مشي ٢٠–٣٠ دقيقة وإطالات خفيفة بجهد أقل من ٥٠٪. جسمك يحتاج راحة اليوم.',orig}
    : {type:'light',title:'نسخة خفيفة: '+orig.title,details:'جاهزيتك اليوم متوسطة، فخففنا الحمل:\n• نص العدد أو المدة\n• الجهد لا يتعدى ٧٠٪\n• وقّف إذا حسيت ثقل بالرجلين\n\nالتمرين الأصلي:\n'+orig.details,orig};
}
function restoreOrig(d){ const s=state.sessions[d]; if(s&&s.orig) state.sessions[d]={...s.orig}; }

  ['sleep', h => h<12?'كيف كان نومك البارح؟':'كيف نمت البارح؟', [['😫','سيء جدًا'],['😕','سيء'],['😐','عادي'],['🙂','زين'],['😴','نمت عدل']]],

function greet(hr){
  if (hr>=4 && hr<12) return `صباح الخير يا ${NAME} ☀️`;

function coachReply(t, r){

  if (mToday) msg += ` وعندك مباراة اليوم${mToday.time?' الساعة '+mToday.time:''}، الله يوفقك! اشرب ماء كفاية من الحين.`;
  else if (s && s.orig) msg += s.type==='recovery' ? ' حوّلت تمرين اليوم لاستشفاء خفيف، جسمك يستاهل راحة.' : ' خففت لك تمرين اليوم.';
  else if (!s || s.type==='rest') msg += ' واليوم راحة، استمتع فيه 😌';

  else if (sc>=3) msg += ` اليوم عندك «${s.title}»، إذا حسيت ثقل خففه من الزر تحت.`;

  if (mTom && !mToday) msg += ` وبكرة عندك مباراة، نومك الليلة مهم 👀`;

  const box=$('hero'), t=todayISO(), s=state.sessions[t], lg=state.logs[t], ty=s?(TYPES[s.type]||TYPES.rest):TYPES.rest;
  const col = s ? getComputedStyle(document.documentElement).getPropertyValue(ty.c.slice(4,-1)).trim() : '';
  const sun=addDays(t,-parse(t).getDay()), letters=['ح','ن','ث','ر','خ','ج','س'];
  const dots = letters.map((l,i)=>{ const d=addDays(sun,i), ss=state.sessions[d], ll=state.logs[d]; const on = ll&&ll.done; const cls = on?'on':(d===t?'now':''); return `<span><i class="${cls}" style="${!on&&ss&&ss.type==='rest'?'opacity:.35':''}"></i>${l}</span>`; }).join('');
  const isMatch = s && s.type==='match', isRest = !s || s.type==='rest';
  box.innerHTML = `<div class="hero${isMatch?' match':''}" style="${!isMatch&&!isRest&&col?`--hc:${col}`:''}${isRest?';--hc:#4E6B5A':''}">
    <div class="lbl">تمرين اليوم</div>
    <h2>${isRest?'يوم راحة 😌':s.title}</h2>
    <span class="ty">${isRest?'استمتع بيومك':ty.l}${lg&&lg.done?'، أنهيته ✓':''}</span>
    <div class="hbtns">${s?`<button class="go" id="hGo">${isRest?'التفاصيل':(lg&&lg.done?'شوف التمرين':'ابدأ التمرين')}</button>`:''}${s&&!isRest&&!(lg&&lg.done)?`<button class="ok" id="hDone">${isMatch?'قيّم المباراة':'أنهيته ✓'}</button>`:''}</div>
    <div class="wkdots">${dots}</div><div class="wx" id="wxLine" hidden></div></div>`;
  const g=$('hGo'); if(g) g.onclick=()=>openDay(t);
  const d=$('hDone'); if(d) d.onclick=()=>openDay(t);
  renderWx();
}

/* ---------- laws quiz bank: قانون كرة القدم ٢٠٢٦/٢٠٢٧ (IFAB, Arabic edition) ---------- */
const QCAT = {'11':'التسلل','9':'الكرة في اللعب وخارجه','15':'رمية التماس','16':'ركلة المرمى','17':'الركلة الركنية','14':'ركلة الجزاء','6':'الحكم المساعد','g':'التمركز والإشارات','n':'تعديلات ٢٦/٢٧'};
const QUIZ = [
 {c:'11',p:109,q:'هل التواجد في موقف تسلل يعتبر خطأ بحد ذاته؟',o:['نعم دائمًا','لا، يُعاقب فقط إذا شارك في اللعب النشط','نعم إذا كان في منطقة الجزاء'],a:1,w:'التواجد في موقف التسلل ليس خطأ بحد ذاته. يُعاقب اللاعب فقط إذا أصبح مشاركًا في اللعب النشط بالتداخل في اللعب أو مع المنافس أو الحصول على ميزة.'},
 {c:'11',p:109,q:'لاعب واقف على خط المنتصف تمامًا لحظة لعب الكرة. هل ممكن يكون في موقف تسلل؟',o:['نعم','لا'],a:1,w:'موقف التسلل يتطلب وجود جزء من الرأس أو الجسم أو القدم في نصف ملعب المنافس، وخط المنتصف مستثنى من ذلك.'},
 {c:'11',p:109,q:'أي أجزاء الجسم ما تُحسب عند تحديد موقف التسلل؟',o:['الرأس','القدمين','الأيدي والأذرع'],a:2,w:'لا تُحسب الأيدي والأذرع لكل اللاعبين بما فيهم الحراس. والحد الأعلى للذراع يتماشى مع الجزء السفلي من الإبط.'},
 {c:'11',p:109,q:'مهاجم على نفس مستوى ثاني آخر منافس لحظة لعب الكرة. القرار؟',o:['متسلل','ليس في موقف تسلل'],a:1,w:'لا يعتبر اللاعب في موقف تسلل إذا كان في نفس المستوى مع ثاني آخر منافس، أو مع آخر اثنين من المنافسين.'},
 {c:'11',p:109,q:'مهاجم على نفس مستوى آخر اثنين من المنافسين (الحارس ومدافع). هل هو في موقف تسلل؟',o:['نعم','لا'],a:1,w:'التساوي مع آخر اثنين من المنافسين يعني إنه ليس في موقف تسلل.'},
 {c:'11',p:109,q:'عند تحديد لحظة لعب الكرة للتسلل، أي نقطة تلامس تُستخدم عادة؟',o:['أول نقطة تلامس','آخر نقطة تلامس','لحظة وصول الكرة للمهاجم'],a:0,w:'يجب استخدام أول نقطة تلامس للعب أو لمس الكرة، باستثناء حالة رمي الحارس للكرة.'},
 {c:'11',p:109,q:'الحارس رمى الكرة بيده لزميله. أي لحظة تُستخدم لتحديد موقف التسلل؟',o:['أول نقطة تلامس','آخر نقطة تلامس قبل ما تطلع من يده','لحظة ملامسة الكرة للأرض'],a:1,w:'عندما يرمي حارس المرمى الكرة، تُستخدم نقطة التلامس الأخيرة لتحديد موقف التسلل.'},
 {c:'11',p:109,q:'مهاجم في موقف تسلل ما لمس الكرة، لكنه منع المدافع من لعبها بإعاقة واضحة لخط رؤيته. القرار؟',o:['ما فيه تسلل لأنه ما لمس الكرة','تسلل لأنه تداخل مع المنافس'],a:1,w:'من صور التداخل مع المنافس: منعه من لعب الكرة أو القدرة على لعبها بإعاقة واضحة لخط رؤيته.'},
 {c:'11',p:109,q:'مهاجم في موقف تسلل حاول بوضوح لعب كرة قريبة منه وأثّرت محاولته على المدافع، لكنه ما لمسها. القرار؟',o:['تسلل','ما فيه تسلل'],a:0,w:'المحاولة الواضحة للعب كرة قريبة عندما تؤثر على المنافس تُعتبر تداخلًا معه، فيُحتسب التسلل.'},
 {c:'11',p:110,q:'تسديدة ارتدت من القائم ووصلت لمهاجم كان في موقف تسلل لحظة التسديد. القرار؟',o:['تسلل','ما فيه تسلل لأن الكرة لمست القائم'],a:0,w:'يعتبر حصل على ميزة إذا لعب الكرة بعد ارتدادها أو انحرافها من القائم أو العارضة أو أحد حكام المباراة أو أي منافس.'},
 {c:'11',p:110,q:'الكرة ارتدت من الحكم ووصلت لمهاجم كان في موقف تسلل. هل يُحتسب تسلل؟',o:['نعم','لا'],a:0,w:'ارتداد الكرة من أحد حكام المباراة لا يلغي موقف التسلل، ويعتبر المهاجم قد حصل على ميزة.'},
 {c:'11',p:110,q:'مدافع لعب الكرة متعمدًا (تمريرة سيئة) ووصلت لمهاجم في موقف تسلل. القرار؟',o:['تسلل','ما فيه تسلل'],a:1,w:'الاستلام من منافس لعب الكرة متعمدًا لا يعتبر حصولًا على ميزة. وكون التمريرة غير دقيقة لا ينفي إنها لعب متعمد.'},
 {c:'11',p:110,q:'مدافع لمس الكرة بيده متعمدًا ووصلت لمهاجم كان في موقف تسلل. هل يُعاقب المهاجم بالتسلل؟',o:['نعم','لا'],a:1,w:'اللعب المتعمد من المنافس يشمل لمس الكرة متعمدًا باليد، فالمهاجم لا يعتبر قد حصل على ميزة.'},
 {c:'11',p:110,q:'حارس أنقذ تسديدة متجهة للمرمى، وارتدت لمهاجم كان في موقف تسلل. القرار؟',o:['تسلل','ما فيه تسلل'],a:0,w:'الإنقاذ المتعمد من أي منافس لا يلغي التسلل، فيُحتسب على المهاجم.'},
 {c:'11',p:111,q:'وش تعريف «الإنقاذ» في قانون التسلل؟',o:['أي لمسة من المدافع للكرة','إيقاف أو محاولة إيقاف كرة متجهة للمرمى أو قريبة جدًا منه بأي جزء من الجسم عدا اليدين','أي لمسة من الحارس فقط'],a:1,w:'الإنقاذ هو إيقاف أو محاولة إيقاف كرة متجهة للمرمى أو قريبة جدًا منه بأي جزء من الجسم عدا اليدين والذراعين، إلا الحارس داخل منطقة جزائه.'},
 {c:'11',p:110,q:'أي من هذي يُعتبر مؤشر إن المدافع «لعب الكرة متعمدًا»؟',o:['الكرة ارتدت عليه فجأة وبسرعة','الكرة جاءت من مسافة وكان يشوفها بوضوح','كان في حالة قفز كرد فعل'],a:1,w:'من المؤشرات: الكرة جاءت من مسافة واللاعب يراها بوضوح، ما كانت سريعة، اتجاهها متوقع، وعنده وقت لتنسيق جسمه.'},
 {c:'11',p:111,q:'من أي استئناف ما فيه تسلل إذا استلم اللاعب الكرة مباشرة؟',o:['الركلة الحرة','رمية التماس','ركلة البداية'],a:1,w:'لا يوجد تسلل إذا استلم اللاعب الكرة مباشرة من ركلة مرمى أو رمية تماس أو ركلة ركنية.'},
 {c:'11',p:111,q:'وش عقوبة خطأ التسلل؟',o:['ركلة حرة مباشرة','ركلة حرة غير مباشرة من مكان الخطأ','إسقاط كرة'],a:1,w:'تُحتسب ركلة حرة غير مباشرة من مكان ارتكاب الخطأ، حتى لو كان في نصف ملعب اللاعب نفسه.'},
 {c:'11',p:111,q:'مدافع غادر الملعب بدون إذن الحكم. كيف يُحسب موقعه لأغراض التسلل؟',o:['كأنه غير موجود','كأنه على خط المرمى أو خط التماس','كأنه في مكانه قبل ما يطلع'],a:1,w:'يعتبر موجودًا على خط المرمى أو التماس حتى أول توقف للعب، أو حتى يلعب الفريق المدافع الكرة باتجاه خط المنتصف وخارج منطقة جزائه. وإذا غادر متعمدًا يُنذر عند أول توقف.'},
 {c:'11',p:111,q:'مهاجم في موقف تسلل يتحرك نحو الكرة، وارتُكب ضده خطأ قبل ما يلعبها أو يحاول. وش يُحتسب؟',o:['التسلل','الخطأ ضده'],a:1,w:'يُحتسب الخطأ لأنه حدث قبل خطأ التسلل.'},
 {c:'11',p:111,q:'مهاجم في موقف تسلل كان بالفعل يتنافس على الكرة، وارتُكب ضده خطأ. وش يُحتسب؟',o:['التسلل','الخطأ ضده'],a:0,w:'يُعاقب على التسلل باعتباره حدث قبل الخطأ عند التنافس.'},
 {c:'11',p:112,q:'مهاجم بقي ثابتًا داخل المرمى بين القائمين، ودخلت الكرة المرمى. القرار؟',o:['يُحتسب الهدف ما لم يرتكب تسلل أو خطأ','لا يُحتسب الهدف أبدًا','إسقاط كرة'],a:0,w:'يُحتسب الهدف ما لم يكن اللاعب قد ارتكب خطأ التسلل أو خطأ حسب المادة ١٢.'},
 {c:'11',p:112,q:'مهاجم طلع برا خط المرمى عشان يبين إنه مو مشارك، ثم رجع وتداخل في اللعب قبل أول توقف. كيف يُحسب موقعه؟',o:['كأنه على خط المرمى','كأنه غير موجود','يُطرد'],a:0,w:'إذا عاد وتداخل قبل أول توقف أو قبل أن يلعب الفريق المدافع الكرة باتجاه المنتصف وخارج منطقة جزائه، يعتبر موجودًا على خط المرمى لأغراض التسلل.'},
 {c:'9',p:101,q:'متى تكون الكرة خارج اللعب؟',o:['إذا لمست الخط','إذا اجتازت بكاملها خط المرمى أو التماس على الأرض أو في الهواء','إذا عبر نصفها'],a:1,w:'تعتبر خارج اللعب عندما تجتاز بكاملها خط المرمى أو خط التماس، سواء على الأرض أو في الهواء، أو عندما يوقف الحكم اللعب.'},
 {c:'9',p:101,q:'الكرة لمست الحكم وبقيت في الملعب، وبدأ منها فريق هجومًا واعدًا. القرار؟',o:['يستمر اللعب','يوقف اللعب ويُستأنف بإسقاط الكرة','ركلة حرة غير مباشرة'],a:1,w:'إذا لمست الكرة أحد حكام المباراة وبدأ فريق هجومًا واعدًا، أو دخلت المرمى مباشرة، أو تغيّر الفريق المستحوذ، يُستأنف اللعب بإسقاط الكرة.'},
 {c:'9',p:101,q:'الكرة لمست الحكم المساعد ودخلت المرمى مباشرة. القرار؟',o:['هدف','إسقاط كرة','ركلة مرمى'],a:1,w:'ذهاب الكرة مباشرة إلى المرمى بعد لمسها أحد حكام المباراة يعني إيقاف اللعب واستئنافه بإسقاط الكرة.'},
 {c:'9',p:101,q:'الكرة ارتدت من قائم الراية الركنية وبقيت داخل الملعب. القرار؟',o:['خارج اللعب','الكرة في اللعب'],a:1,w:'الكرة في اللعب عندما ترتد من قائم المرمى أو العارضة أو قائم الراية الركنية وتبقى في الملعب.'},
 {c:'15',p:141,q:'كم مسافة المنافسين عن نقطة تنفيذ رمية التماس؟',o:['متر واحد','متران','٩٫١٥ م'],a:1,w:'جميع المنافسين على بعد لا يقل عن مترين من النقطة على خط التماس اللي تُنفّذ منها الرمية.'},
 {c:'15',p:141,q:'رمية تماس دخلت مباشرة مرمى المنافس. القرار؟',o:['هدف','ركلة مرمى','ركلة ركنية'],a:1,w:'لا يمكن تسجيل هدف مباشر من رمية التماس. إذا دخلت مرمى المنافس تُحتسب ركلة مرمى.'},
 {c:'15',p:141,q:'رمية تماس دخلت مباشرة مرمى فريق الرامي نفسه. القرار؟',o:['هدف عكسي','ركلة ركنية','ركلة مرمى'],a:1,w:'إذا دخلت الكرة مرمى نفس الفريق تُحتسب ركلة ركنية.'},
 {c:'15',p:141,q:'الكرة من رمية التماس لمست الأرض قبل ما تدخل الملعب. القرار؟',o:['رمية للمنافس','تُعاد الرمية لنفس الفريق من نفس المكان','يستمر اللعب'],a:1,w:'الكرة تصبح في اللعب عندما تدخل الملعب. إذا لمست الأرض قبل الدخول تُعاد من نفس الفريق ومن نفس المكان.'},
 {c:'15',p:141,q:'اللاعب نفّذ رمية التماس بطريقة غير صحيحة. القرار؟',o:['تُعاد لنفس الفريق','تُعاد عن طريق الفريق المنافس','إنذار'],a:1,w:'إذا نُفذت رمية التماس بطريقة غير صحيحة، يعاد تنفيذها عن طريق الفريق المنافس.'},
 {c:'15',p:141,q:'وش شروط قدمي الرامي لحظة رمية التماس؟',o:['قدم وحدة على الأرض','جزء من كلتا القدمين على خط التماس أو على الأرض خارجه','القدمين داخل الملعب'],a:1,w:'يقف مواجهًا للملعب، وجزء من كلتا قدميه على خط التماس أو على الأرض خارجه، ويرمي بكلتا يديه من خلف وفوق رأسه.'},
 {c:'15',p:142,q:'منفذ رمية التماس لمس الكرة مرة ثانية قبل ما تلمس لاعب آخر. القرار؟',o:['تُعاد الرمية','ركلة حرة غير مباشرة','ركلة حرة مباشرة'],a:1,w:'تُحتسب ركلة حرة غير مباشرة. وإذا كانت اللمسة الثانية باليد تُحتسب ركلة حرة مباشرة أو ركلة جزاء.'},
 {c:'15',p:142,q:'منافس اقترب أقل من مترين وشتت منفذ رمية التماس. وش الإجراء؟',o:['تُعاد الرمية فقط','إنذار للسلوك غير الرياضي','طرد'],a:1,w:'يُنذر المنافس للسلوك غير الرياضي، وإذا كانت الرمية قد نُفذت بالفعل تُحتسب ركلة حرة غير مباشرة.'},
 {c:'15',p:141,q:'رامي التماس رمى الكرة عمدًا على المنافس بدون تهور ليلعبها مرة ثانية. القرار؟',o:['يستمر اللعب','ركلة حرة غير مباشرة','إنذار'],a:0,w:'إذا لم يكن فيها إهمال أو تهور أو استخدام قوة مفرطة، يسمح الحكم باستمرار اللعب.'},
 {c:'n',p:26,q:'جديد ٢٦/٢٧: لاعب يؤخر رمية التماس عمدًا، وبدأ الحكم العد التنازلي وانتهى قبل التنفيذ. القرار؟',o:['إنذار وتُعاد الرمية','رمية تماس للفريق المنافس من نفس المكان','ركلة حرة غير مباشرة'],a:1,w:'بروتوكول العد التنازلي: إذا لم تصبح الكرة في اللعب بنهاية الخمس ثوانٍ، تُحتسب رمية تماس للفريق المنافس من نفس مكان الرمية الأصلية.'},
 {c:'n',p:26,q:'جديد ٢٦/٢٧: كم مدة العد التنازلي المرئي لرمية التماس وركلة المرمى؟',o:['٣ ثوانٍ','٥ ثوانٍ','٨ ثوانٍ'],a:1,w:'خمس ثوانٍ، ويؤديها الحكم بيد مرفوعة، ويجوز أن يصاحبها عد لفظي.'},
 {c:'n',p:26,q:'جديد ٢٦/٢٧: بعد انتهاء العد ومنح الرمية للمنافس، هل يُنذر اللاعب المتأخر تلقائيًا؟',o:['نعم دائمًا','لا، إلا إذا أخّر استئناف المنافس بصورة مفرطة'],a:1,w:'لا يُشهر الإنذار إلا إذا قام اللاعب أو زملاؤه بتأخير استئناف اللعب من قبل الفريق المنافس بصورة مفرطة.'},
 {c:'n',p:27,q:'جديد ٢٦/٢٧: هل لازم الحكم ينتظر اللاعب يمسك الكرة قبل ما يبدأ العد التنازلي؟',o:['نعم','لا'],a:1,w:'لا يُشترط انتظار الاستحواذ. يجوز البدء إذا تعمّد اللاعب التأخير بالتباطؤ في استرجاع الكرة أو باتخاذ مكان غير صحيح للرمية.'},
 {c:'n',p:27,q:'جديد ٢٦/٢٧: اللاعب كان يرمي الكرة لحظة وصول الحكم لنهاية العد التنازلي. القرار؟',o:['تُمنح للمنافس','لا يُعاقب ويستمر'],a:1,w:'بما إن الهدف هو منع إضاعة الوقت، لا ينبغي معاقبة اللاعب إذا كان بصدد التنفيذ لحظة نهاية العد.'},
 {c:'n',p:26,q:'جديد ٢٦/٢٧: فريق يؤخر ركلة المرمى وانتهى العد التنازلي. القرار؟',o:['تُعاد ركلة المرمى','ركلة ركنية للفريق المنافس','ركلة حرة غير مباشرة'],a:1,w:'تُحتسب ركلة ركنية للفريق المنافس من الجهة الأقرب لمكان تنفيذ ركلة المرمى.'},
 {c:'16',p:145,q:'متى تصبح الكرة في اللعب في ركلة المرمى؟',o:['إذا خرجت من منطقة الجزاء','عندما تُركل وتتحرك بوضوح','إذا لمسها لاعب ثاني'],a:1,w:'تصبح الكرة في اللعب عندما تُركل وتتحرك بوضوح، حتى داخل منطقة الجزاء.'},
 {c:'16',p:145,q:'من وين تُنفذ ركلة المرمى؟',o:['من زاوية منطقة المرمى فقط','من أي مكان داخل منطقة المرمى','من داخل منطقة الجزاء'],a:1,w:'الكرة ثابتة وتُركل من أي مكان داخل منطقة المرمى بواسطة لاعب من الفريق المدافع.'},
 {c:'16',p:145,q:'ركلة مرمى دخلت مباشرة مرمى منفذ الركلة. القرار؟',o:['هدف','ركلة ركنية للفريق المنافس','تُعاد'],a:1,w:'يمكن التسجيل مباشرة من ركلة المرمى في مرمى المنافس فقط. إذا دخلت مرمى المنفذ تُحتسب ركلة ركنية للمنافس.'},
 {c:'16',p:146,q:'منافس كان داخل منطقة الجزاء عند تنفيذ ركلة المرمى لأنه ما لحق يطلع، وما لمس الكرة. القرار؟',o:['تُعاد الركلة','يسمح الحكم باستمرار اللعب','إنذار'],a:1,w:'إذا لم يتوفر له الوقت للخروج يُسمح باستمرار اللعب. أما إذا لمس الكرة أو نافس عليها قبل ما تصبح في اللعب تُعاد الركلة.'},
 {c:'17',p:149,q:'حارس المرمى سيطر على الكرة بيده داخل منطقة الجزاء أكثر من ٨ ثوانٍ. القرار؟',o:['ركلة حرة غير مباشرة','ركلة ركنية للفريق المنافس','إنذار'],a:1,w:'تُحتسب ركلة ركنية للمنافس إذا سيطر الحارس على الكرة بيده أو ذراعه أكثر من ثماني ثوانٍ. والحكم يعد آخر خمس ثوانٍ بيده المرفوعة.'},
 {c:'17',p:119,q:'هل يجوز للمهاجم منافسة الحارس وهو مسيطر على الكرة بيده؟',o:['نعم','لا'],a:1,w:'لا يمكن لأي منافس منافسة حارس المرمى وهو مسيطر على الكرة بيده أو ذراعه.'},
 {c:'17',p:149,q:'متى تصبح الكرة في اللعب في الركلة الركنية؟',o:['إذا خرجت من المنطقة الركنية','عندما تُركل وتتحرك بوضوح'],a:1,w:'تصبح في اللعب عندما تُركل وتتحرك بوضوح، وليس من الضروري أن تخرج من المنطقة الركنية.'},
 {c:'17',p:149,q:'كم مسافة المنافسين في الركلة الركنية؟',o:['٥ م من الكرة','٩٫١٥ م من قوس المنطقة الركنية','متران'],a:1,w:'يبقى المنافسون على مسافة لا تقل عن ٩٫١٥ م من قوس المنطقة الركنية حتى تصبح الكرة في اللعب.'},
 {c:'17',p:149,q:'ركلة ركنية دخلت مباشرة مرمى الفريق المنفذ. القرار؟',o:['هدف عكسي','ركلة ركنية للفريق المنافس','ركلة مرمى'],a:1,w:'يمكن التسجيل مباشرة من الركلة الركنية في مرمى المنافس فقط. إذا دخلت مرمى المنفذ تُحتسب ركلة ركنية للمنافس.'},
 {c:'17',p:149,q:'هل يجوز تحريك قائم الراية الركنية عند تنفيذ الركنية؟',o:['نعم إذا كان يضايق المنفذ','لا'],a:1,w:'لا يجب تحريك قائم الراية الركنية.'},
 {c:'14',p:135,q:'وين لازم يكون الحارس لحظة ركل ركلة الجزاء؟',o:['حر في التقدم','جزء من إحدى قدميه على خط المرمى أو بمستواه أو خلفه','قدميه الاثنتين خلف الخط'],a:1,w:'عند ركل الكرة يجب أن يكون جزء على الأقل من إحدى قدمي الحارس على خط المرمى أو بنفس مستواه أو خلفه.'},
 {c:'14',p:135,q:'وين لازم يكون باقي اللاعبين في ركلة الجزاء؟',o:['خارج منطقة الجزاء فقط','على بعد ٩٫١٥ م من العلامة، خلفها، داخل الملعب، وخارج منطقة الجزاء','أي مكان خارج منطقة المرمى'],a:1,w:'الشروط الأربعة: ٩٫١٥ م على الأقل من علامة الجزاء، خلف العلامة، داخل الملعب، خارج منطقة الجزاء.'},
 {c:'14',p:135,q:'منفذ ركلة الجزاء لعب الكرة بكعب الحذاء وتحركت للأمام. القرار؟',o:['مسموح','غير مسموح'],a:0,w:'يجب ركل الكرة للأمام، ويمكن لعبها بالكعب بشرط أن تتحرك للأمام.'},
 {c:'14',p:136,q:'منفذ ركلة الجزاء ركل الكرة بالخطأ بقدميه الاثنتين في نفس الوقت ودخلت المرمى. القرار؟',o:['هدف','تُعاد الركلة','ركلة حرة غير مباشرة'],a:1,w:'إذا دخلت الكرة المرمى تُعاد الركلة، وإذا لم تدخل تُحتسب ركلة حرة غير مباشرة.'},
 {c:'14',p:137,q:'منفذ ركلة الجزاء خادع بعد ما أكمل الجري. القرار؟',o:['يُحتسب الهدف إذا دخلت','ركلة حرة غير مباشرة وإنذار المنفذ','تُعاد الركلة'],a:1,w:'الخداع أثناء الجري مسموح، أما بعد إكمال الجري فتُحتسب ركلة حرة غير مباشرة ويُنذر المنفذ، بغض النظر عن دخول الكرة.'},
 {c:'14',p:137,q:'حارس المرمى تقدم عن خطه قبل الركلة، والكرة دخلت المرمى. القرار؟',o:['يُحتسب الهدف','تُعاد الركلة'],a:0,w:'إذا دخلت الكرة المرمى يُحتسب الهدف. وإذا منعها الحارس تُعاد الركلة، ويُحذّر عند أول خطأ ويُنذر للأخطاء اللاحقة.'},
 {c:'14',p:137,q:'لاعبون من الفريقين دخلوا منطقة الجزاء قبل الركلة. القرار؟',o:['يُحتسب الهدف','تُعاد الركلة إلا إذا ارتكب أحدهم خطأ أشد','ركلة حرة غير مباشرة'],a:1,w:'إذا أخطأ لاعب من كلا الفريقين تُعاد الركلة، إلا إذا ارتكب لاعب خطأ أشد مثل الخداع غير القانوني.'},
 {c:'6',p:86,q:'متى يأشر الحكم المساعد في ركلة الجزاء؟',o:['إذا تقدم الحارس عن خط المرمى قبل الركل، وعندما تجتاز الكرة خط المرمى','إذا دخل اللاعبون منطقة الجزاء فقط','لا يأشر أبدًا'],a:0,w:'يشير المساعد عندما يتحرك الحارس للأمام من خط المرمى قبل ركل الكرة، وعندما تجتاز الكرة خط المرمى.'},
 {c:'6',p:86,q:'وين يتمركز الحكم المساعد في ركلة الجزاء إذا كان فيه حكم إضافي مساعد؟',o:['على خط المرمى','بمحاذاة علامة الجزاء','عند خط المنتصف'],a:1,w:'إذا عُيّن حكم إضافي مساعد، يتمركز الحكم المساعد بمحاذاة علامة الجزاء.'},
 {c:'6',p:86,q:'هل يجوز للحكم المساعد يدخل الملعب لضبط مسافة ٩٫١٥ م؟',o:['لا أبدًا','نعم، للمساعدة في ضبط المسافة'],a:1,w:'يمكن للمساعد الدخول للمساعدة في ضبط المسافة، ويكون دائمًا بطلب من الحكم، والحكم ينتظر رجوعه قبل الاستئناف.'},
 {c:'g',p:212,q:'بشكل عام، على مستوى مين يتمركز الحكم المساعد؟',o:['آخر مدافع دائمًا','ثاني آخر مدافع، أو الكرة إذا كانت أقرب لخط المرمى','الكرة دائمًا'],a:1,w:'يكون على خط واحد مع ثاني آخر مدافع، أو مع الكرة إذا كانت أقرب لخط المرمى منه، ويواجه الملعب دائمًا.'},
 {c:'g',p:212,q:'في المسافات القصيرة، وش طريقة الجري المطلوبة من الحكم المساعد؟',o:['الجري الأمامي','الجري الجانبي ووجهه للملعب','الجري للخلف'],a:1,w:'يستخدم الجري الجانبي في المسافات القصيرة ووجهه للملعب، وهذا مهم جدًا للحكم على التسلل.'},
 {c:'g',p:213,q:'وين يقف الحكم المساعد في الركلة الركنية؟',o:['عند تقاطع خط المرمى مع منطقة الجزاء','خلف الراية الركنية على خط واحد مع خط المرمى','عند خط المنتصف'],a:1,w:'يقف خلف الراية الركنية على خط واحد مع خط المرمى، بدون ما يتداخل مع المنفذ، ويتأكد إن الكرة داخل المنطقة الركنية.'},
 {c:'g',p:221,q:'وين يتمركز الحكم المساعد في ركلة الجزاء أثناء المباراة (بدون تقنيات)؟',o:['عند تقاطع خط المرمى مع خط منطقة الجزاء','عند راية الركنية','عند خط المنتصف'],a:0,w:'يتمركز على نقطة تقاطع خط المرمى مع خط منطقة الجزاء.'},
 {c:'g',p:221,q:'ركلة جزاء في مباراة فيها تقنية خط المرمى وحكم فيديو. وين الأفضل يكون الحكم المساعد؟',o:['على خط المرمى','على خط التماس مقابل علامة الجزاء (خط التسلل)'],a:1,w:'يُستحسن يكون على خط التماس مقابل علامة الجزاء، لأن التواجد على خط المرمى يمنعه من العودة لتقدير التسلل إذا ارتدت الكرة.'},
 {c:'g',p:220,q:'في ركلات الترجيح، وين الحكمان المساعدان؟',o:['الاثنين عند المرمى','واحد عند تقاطع خط المرمى مع منطقة المرمى، والثاني في دائرة المنتصف','الاثنين في دائرة المنتصف'],a:1,w:'أحدهما على تقاطع خط المرمى مع خط منطقة المرمى، والآخر في دائرة المنتصف للسيطرة على اللاعبين.'},
 {c:'g',p:219,q:'وين يتمركز الحكمان المساعدان عند ركلة البداية؟',o:['على خط المنتصف','على خط واحد مع ثاني آخر مدافع'],a:1,w:'يجب أن يكونا على نفس الخط مع ثاني آخر مدافع.'},
 {c:'g',p:218,q:'الحارس يستعد يطلق الكرة. وين يكون الحكم المساعد؟',o:['على خط التسلل','على خط واحد مع حافة منطقة الجزاء','عند راية الركنية'],a:1,w:'يكون على خط واحد مع حافة منطقة الجزاء ليتأكد إن الحارس ما لمس الكرة بيده خارجها، وبعد ما يطلقها يرجع لخط التسلل.'},
 {c:'g',p:217,q:'في ركلة المرمى، وش أول شي يتأكد منه الحكم المساعد؟',o:['خط التسلل','إن الكرة داخل منطقة المرمى','مكان الحارس'],a:1,w:'يتأكد أولًا إن الكرة داخل منطقة المرمى. إذا ما كانت في مكانها الصحيح، يبقى مكانه ويتواصل مع الحكم ويرفع الراية.'},
 {c:'g',p:216,q:'هدف واضح بدون أي شك. وش يسوي الحكم المساعد؟',o:['يرفع الراية','يتواصل بالرؤية مع الحكم ويجري ٢٥–٣٠ م باتجاه المنتصف بدون رفع الراية','يأشر للمنتصف بالراية'],a:1,w:'يتواصل بالرؤية مع الحكم، ثم يجري بسرعة ٢٥–٣٠ م بطول خط التماس باتجاه خط المنتصف دون رفع الراية.'},
 {c:'g',p:216,q:'هدف سُجل لكن الكرة تبدو كأنها ما زالت في اللعب. وش يسوي المساعد؟',o:['يجري للمنتصف مباشرة','يرفع الراية أولًا لجذب انتباه الحكم ثم يكمل إجراء الهدف','ينتظر قرار الحكم'],a:1,w:'يرفع رايته أولًا لجذب انتباه الحكم، ثم يكمل الإجراء العادي بالجري ٢٥–٣٠ م باتجاه المنتصف.'},
 {c:'g',p:228,q:'بأي يد يرفع الحكم المساعد الراية للتسلل؟',o:['اليسرى','اليمنى','أي يد'],a:1,w:'أول فعل بعد قرار التسلل هو رفع الراية باليد اليمنى، لأنها تعطي أفضل خط رؤية.'},
 {c:'g',p:228,q:'رفعت الراية للتسلل والحكم ما شافها. لين متى تستمر في الإشارة؟',o:['٣ ثوانٍ فقط','حتى يراها الحكم أو تصبح الكرة تحت سيطرة الفريق المدافع بوضوح','حتى يخرج اللعب'],a:1,w:'يواصل الإشارة حتى يراها الحكم أو تصبح الكرة تحت سيطرة الفريق المدافع بشكل واضح.'},
 {c:'g',p:226,q:'احتجت تنقل الراية لليد الثانية. كيف؟',o:['من فوق الرأس','من أسفل عند الخصر','خلف الظهر'],a:1,w:'يتم نقل الراية لليد الأخرى من أسفل عند الخصر.'},
 {c:'g',p:226,q:'بأي يد يحمل المساعد الراية أثناء الجري؟',o:['اليمنى دائمًا','اليد القريبة من الحكم، وغير مطوية','اليسرى دائمًا'],a:1,w:'يجب أن تكون الراية مرئية للحكم وغير مطوية، فتُحمل باليد القريبة من الحكم.'},
 {c:'g',p:226,q:'قبل رفع الراية، وش المطلوب من الحكم المساعد؟',o:['يرفعها وهو يجري','يتوقف عن الجري، يواجه الملعب، يتواصل بالرؤية مع الحكم ثم يرفعها بحركة مقصودة','يصفّر'],a:1,w:'يتوقف عن الجري ويواجه الملعب ويتواصل بالرؤية مع الحكم، ثم يرفع الراية بحركة مقصودة بدون استعجال أو مبالغة.'},
 {c:'g',p:227,q:'مدافع ارتكب خطأ داخل منطقة الجزاء قريب منك، والحكم ما اتخذ قرار. وش تسوي؟',o:['تنتظر نهاية الهجمة','ترفع الراية، تستخدم جهاز التواصل، وتتحرك على خط التماس باتجاه الراية الركنية','تدخل الملعب'],a:1,w:'بعد التواصل بالرؤية، إذا لم يتخذ الحكم قرارًا يرفع المساعد رايته ويستخدم جهاز التواصل ويتحرك بوضوح على خط التماس باتجاه الراية الركنية.'},
 {c:'g',p:228,q:'خطأ قرب حدود منطقة الجزاء لكنه خارجها. كيف توضح للحكم إنه خارج المنطقة؟',o:['تأشر للأرض','تتحرك على خط التماس باتجاه خط المنتصف','ترفع الراية للأعلى'],a:1,w:'يتحرك المساعد بوضوح على خط التماس باتجاه خط المنتصف ليوضح إن المخالفة خارج منطقة الجزاء.'},
 {c:'g',p:227,q:'عند الإشارة لخطأ، كيف تحرك الراية؟',o:['تلوّح فيها بقوة','تحركها بصورة خفيفة ذهابًا وإيابًا','تثبتها بدون حركة'],a:1,w:'تحريك الراية بصورة خفيفة ذهابًا وإيابًا، وتجنب الحركة المبالغ فيها أو العدائية.'},
 {c:'g',p:227,q:'شفت خطأ لكن الفريق المتضرر عنده هجمة مفيدة. وش الأسلوب الصحيح؟',o:['ترفع الراية فورًا','«شاهد وانتظر» وتتواصل بالرؤية مع الحكم'],a:1,w:'يستخدم المساعد أسلوب «شاهد وانتظر» ليسمح باستمرار اللعب عند إتاحة الفرصة، مع التواصل بالرؤية مع الحكم.'},
 {c:'g',p:226,q:'الكرة عبرت خط المرمى بعيد عنك، والقرار (ركنية أو مرمى) مو واضح لك. وش تسوي؟',o:['تقرر بنفسك','تتواصل بالرؤية مع الحكم وتتبع قراره'],a:1,w:'إذا كانت قريبة يقرر المساعد، وإذا كانت بعيدة يتواصل بالرؤية مع الحكم ويتبع قراره.'},
 {c:'g',p:229,q:'الكرة طلعت تماس بعيد عنك وعندك شك في اتجاه الرمية. وش تسوي؟',o:['تأشر لأي اتجاه','ترفع الراية لتبين إن الكرة خرجت، ثم تتواصل بالرؤية وتتبع إشارة الحكم'],a:1,w:'يرفع رايته ليبين للحكم خروج الكرة، ثم يتواصل بالرؤية ويتبع إشارة الحكم.'},
 {c:'g',p:222,q:'طلب تبديل وما فيه حكم رابع. وش يسوي الحكم المساعد؟',o:['يكمل مكانه','يتحرك لخط المنتصف للمساعدة، والحكم ينتظر رجوعه قبل الاستئناف'],a:1,w:'إذا لم يوجد حكم رابع، يتحرك المساعد لخط المنتصف للمساعدة في التبديل، والحكم ينتظر رجوعه قبل استئناف اللعب.'},
 {c:'g',p:213,q:'الحكم احتاج استشارة مباشرة معك. كيف تكون؟',o:['تجري له في وسط الملعب','تتقدم ٢–٣ م داخل الملعب ويواجه الاثنين الملعب','تصرخ له من الخط'],a:1,w:'يتقدم المساعد ٢–٣ م داخل الملعب إذا لزم، وعند الحديث يواجهان الملعب لتجنب سماعهم ولمراقبة اللاعبين.'},

const qRef = x => `${x.c==='g'?'الإرشادات العملية':x.c==='n'?'تعديلات القانون':'المادة '+num(x.c)}، صفحة ${num(x.p)}`;

function dayHash(s){ let h=0; for (const c of s) h=(h*31+c.charCodeAt(0))>>>0; return h; }
function quizState(){ if (!state.quiz || state.quiz.v!==2) state.quiz={v:2,answers:{},daily:{}}; state.quiz.wrong ||= {}; return state.quiz; }
function recordAnswer(qi, pick, extra){ const Q=quizState(), ok=pick===QUIZ[qi].a; Q.answers[qi]={pick,ok,date:todayISO(),extra:!!extra};
  if (!ok) Q.wrong[qi]={n:((Q.wrong[qi]||{}).n||0)+1, fix:0};
  else if (Q.wrong[qi]){ Q.wrong[qi].fix=(Q.wrong[qi].fix||0)+1; if (Q.wrong[qi].fix>=2) delete Q.wrong[qi]; }
  return ok; }
function quizOf(date){ const q=quizState(); if (q.daily[date]!=null && QUIZ[q.daily[date]]) return q.daily[date];
  // prefer new-rule and assistant-referee questions on alternate days
  const wr=Object.keys(q.wrong||{}).map(Number).filter(i=>QUIZ[i]);
  if (wr.length && dayHash(date)%2===0){ const i=wr[dayHash(date+'w')%wr.length]; q.daily[date]=i; return i; }
  let i=dayHash(date)%QUIZ.length; for (let k=0;k<QUIZ.length && q.answers[i];k++) i=(i+1)%QUIZ.length; q.daily[date]=i; return i; }
function shuffled(qi){ const n=QUIZ[qi].o.length, idx=[...Array(n).keys()]; let s=dayHash('q'+qi); for(let i=n-1;i>0;i--){ s=(s*1103515245+12345)>>>0; const j=s%(i+1); [idx[i],idx[j]]=[idx[j],idx[i]]; } return idx; }
function qBlock(qi, onAnswer, answered){
  const x=QUIZ[qi], order=shuffled(qi), wrap=document.createElement('div');
  wrap.innerHTML=`<span class="qtag">${QCAT[x.c]}</span><p class="qq"></p>`; wrap.querySelector('.qq').textContent=x.q;
  const w=document.createElement('div'); w.className='qopts';
  order.forEach(i=>{ const b=document.createElement('button'); b.textContent=x.o[i];
    if (answered){ b.disabled=true; if(i===x.a) b.className='ok'; else if(i===answered.pick) b.className='no'; }
    b.onclick=()=>onAnswer(i); w.appendChild(b); });
  wrap.appendChild(w);
  if (answered){ const p=document.createElement('p'); p.className='qwhy'; p.innerHTML=`${answered.ok?'✅ صح! ':'❌ الإجابة الصحيحة مظللة بالأخضر. '}<span></span><small class="qref">📖 ${qRef(x)}</small>`; p.querySelector('span').textContent=x.w; wrap.appendChild(p); }
  return wrap;
}
let quizExtra=null, quizOpen=false;
function renderQuiz(){

  const t=todayISO(), qi = quizExtra ?? quizOf(t), a=Q.answers[qi], answered = a && (quizExtra!=null ? a.date===t && a.extra : a.date===t) ? a : null;

    box.innerHTML=''; box.appendChild(c); return;
  }

  c.innerHTML=`<div class="chead"><span class="cav">⚖️</span><b>${quizExtra!=null?'سؤال إضافي':'سؤال اليوم'}</b><span class="rpct" style="margin-inline-start:auto">${num(Object.values(Q.answers).filter(x=>x.ok).length)}/${num(QUIZ.length)} صح</span></div>`;
  c.appendChild(qBlock(qi, i=>{ recordAnswer(qi,i,quizExtra!=null); save(); renderQuiz(); renderLaw(); }, answered));

    more.onclick=()=>{ const left=QUIZ.map((_,i)=>i).filter(i=>!Q.answers[i]); quizExtra = left.length ? left[Math.floor(Math.random()*left.length)] : Math.floor(Math.random()*QUIZ.length); if(!left.length) delete Q.answers[quizExtra]; renderQuiz(); }; c.appendChild(more); }

function openExam(){
  const Q=quizState(), N=Math.min(20,QUIZ.length), LIMIT=20*60;

  pool.forEach(i=>{ if(pick.length<N && !pick.includes(i)) pick.push(i); });
  const qs=pick.slice(0,N).sort(()=>Math.random()-.5), ans={}; let pos=0, left=LIMIT, tick=null, done=false;
  openSheet(sh=>{
    const finish=()=>{ if(done) return; done=true; clearInterval(tick);
      const right=qs.filter(qi=>ans[qi]===QUIZ[qi].a).length, pct=Math.round(100*right/qs.length);
      qs.forEach(qi=>{ if(ans[qi]!=null) recordAnswer(qi,ans[qi],true); });
      (Q.exams ||= []).push({date:todayISO(),right,total:qs.length,secs:LIMIT-left}); save(); renderLaw();
      sh.querySelectorAll('.pbody').forEach(e=>e.remove()); const b=document.createElement('div'); b.className='pbody';
      b.innerHTML=`<div class="exres ${pct>=80?'pass':'fail'}"><b>${num(pct)}٪</b><span>${num(right)} من ${num(qs.length)} صح</span><small>${pct>=80?'ناجح 👏 مستوى ممتاز':'تحتاج مراجعة، النجاح من ٨٠٪'}، الوقت ${num(Math.floor((LIMIT-left)/60))}:${String((LIMIT-left)%60).padStart(2,'0')}</small></div><h3 style="margin:16px 0 6px">${right<qs.length?'راجع أخطاءك':'ولا خطأ! 🔥'}</h3>`;
      qs.filter(qi=>ans[qi]!==QUIZ[qi].a).forEach(qi=>{ const x=QUIZ[qi]; const d=document.createElement('div'); d.className='exrev';
        d.innerHTML=`<span class="qtag"></span><p class="qq"></p><p class="exa">❌ ${ans[qi]!=null?'إجابتك: <span class="y"></span><br>':'ما جاوبت<br>'}✅ الصحيحة: <span class="c"></span></p><p class="qwhy"><span class="w"></span><small class="qref">📖 ${qRef(x)}</small></p>`;
        d.querySelector('.qtag').textContent=QCAT[x.c]; d.querySelector('.qq').textContent=x.q; if(ans[qi]!=null) d.querySelector('.y').textContent=x.o[ans[qi]]; d.querySelector('.c').textContent=x.o[x.a]; d.querySelector('.w').textContent=x.w; b.appendChild(d); });
      const c=document.createElement('button'); c.className='btn primary'; c.style.marginTop='14px'; c.textContent='إغلاق'; c.onclick=closeSheet; b.appendChild(c); sh.appendChild(b); sh.scrollTop=0; };
    const draw=()=>{ sh.querySelectorAll('.pbody').forEach(e=>e.remove()); const body=document.createElement('div'); body.className='pbody';
      const qi=qs[pos], x=QUIZ[qi], order=shuffled(qi);
      body.innerHTML=`<div class="exhead"><h2>اختبار تجريبي</h2><span class="extime" id="exT"></span></div>
        <div class="exdots">${qs.map((q,i)=>`<button data-i="${i}" class="${i===pos?'cur':''} ${ans[q]!=null?'ans':''}">${num(i+1)}</button>`).join('')}</div>
        <span class="qtag">${QCAT[x.c]}</span><p class="qq"></p><div class="qopts"></div>
        <div class="row"><button class="btn ghost" id="exP" ${pos===0?'disabled':''}>السابق</button><button class="btn primary" id="exN">${pos<qs.length-1?'التالي':'إنهاء وتصحيح'}</button></div>`;
      body.querySelector('.qq').textContent=x.q;
      const w=body.querySelector('.qopts'); order.forEach(i=>{ const b=document.createElement('button'); b.textContent=x.o[i]; if(ans[qi]===i) b.className='sel'; b.onclick=()=>{ ans[qi]=i; draw(); }; w.appendChild(b); });
      body.querySelectorAll('.exdots button').forEach(b=>b.onclick=()=>{ pos=+b.dataset.i; draw(); });
      body.querySelector('#exP').onclick=()=>{ pos--; draw(); };
      body.querySelector('#exN').onclick=()=>{ if(pos<qs.length-1){ pos++; draw(); } else { const un=qs.filter(q=>ans[q]==null).length; if(!un || confirm(`باقي ${un} سؤال بدون إجابة. تنهي الاختبار؟`)) finish(); } };
      sh.appendChild(body); upd(); };
    const upd=()=>{ const el=sh.querySelector('#exT'); if(el){ el.textContent=`⏱ ${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}`; el.classList.toggle('low',left<=120); } };
    tick=setInterval(()=>{ if(!sh.isConnected || $('scrim').hidden){ clearInterval(tick); return; } left--; upd(); if(left<=0) finish(); },1000);
    draw();
  });
}
function openPractice(cat){
  const Q=quizState(); const pool=QUIZ.map((x,i)=>i).filter(i=>cat==='all'||(cat==='wrong'?Q.wrong[i]:QUIZ[i].c===cat));

    const draw=(ans)=>{ sh.querySelectorAll('.pbody').forEach(e=>e.remove()); const body=document.createElement('div'); body.className='pbody';
      if (pos>=order.length || !order.length){ body.innerHTML=`<h2>${order.length?'خلصت! 🎉':'ما فيه أسئلة'}</h2><p class="sub">${num(right)} صح من ${num(order.length)}</p>`; const b=document.createElement('button'); b.className='btn primary'; b.textContent='إغلاق'; b.onclick=closeSheet; body.appendChild(b); sh.appendChild(body); return; }

}

const ROLES=['حكم مساعد أول','حكم مساعد ثاني','حكم رابع','حكم ساحة'];
const seasonOf = d => { const x=parse(d), y=x.getFullYear(); return x.getMonth()>=7 ? `${y}/${y+1}` : `${y-1}/${y}`; };
let careerSeason=null;
function renderCareer(){
  const box=$('careerPanel'); if(!box) return; const t=todayISO();
  const played=state.matches.filter(m=>m.date<=t);
  const seasons=[...new Set(played.map(m=>seasonOf(m.date)).concat([seasonOf(t)]))].sort().reverse();
  if (!careerSeason || !seasons.includes(careerSeason)) careerSeason=seasons[0];
  const ms=played.filter(m=>seasonOf(m.date)===careerSeason).sort((a,b)=>b.date.localeCompare(a.date));
  const scores=ms.map(m=>parseFloat(m.score)).filter(x=>isFinite(x));
  const avg=scores.length?(scores.reduce((a,b)=>a+b,0)/scores.length):null;
  const byRole={}; ms.forEach(m=>{ if(m.role) byRole[m.role]=(byRole[m.role]||0)+1; });
  const byComp={}; ms.forEach(m=>{ if(m.comp) byComp[m.comp]=(byComp[m.comp]||0)+1; });
  const topComp=Object.entries(byComp).sort((a,b)=>b[1]-a[1])[0];
  box.innerHTML=`<div class="wkh"><div><b>مسيرتي التحكيمية</b><small>موسم ${careerSeason.split('/').map(x=>Number(x).toLocaleString('ar-SA',{useGrouping:false})).reverse().join(' – ')}</small></div>${seasons.length>1?'<select class="in sm" id="seasonSel" style="width:auto"></select>':''}</div>
    <div class="stats" style="margin-top:10px"><div class="stat"><b>${num(ms.length)}</b><span>مباريات</span></div><div class="stat"><b>${avg!=null?num(avg.toFixed(1)):'–'}</b><span>متوسط التقييم</span></div></div>
    ${Object.keys(byRole).length?`<p class="note" style="margin-top:10px">${Object.entries(byRole).map(([r,n])=>`${ROLES[r]}: ${num(n)}`).join('، ')}</p>`:''}
    ${topComp?`<p class="note">أكثر بطولة: ${topComp[0]} (${num(topComp[1])})</p>`:''}`;
  const sel=box.querySelector('#seasonSel'); if(sel){ seasons.forEach(s=>{ const o=document.createElement('option'); o.value=s; o.textContent=s.split('/').map(x=>Number(x).toLocaleString('ar-SA',{useGrouping:false})).reverse().join(' – '); if(s===careerSeason) o.selected=true; sel.appendChild(o); }); sel.onchange=()=>{ careerSeason=sel.value; renderCareer(); }; }
  const ul=document.createElement('ul'); ul.className='mlist';
  if (!ms.length){ box.insertAdjacentHTML('beforeend','<p class="note">لما تضيف مباراة وتقيّمها، تطلع هنا مع بيانات البطولة والفريقين وتقييم المقيّم.</p>'); return; }
  ms.forEach(m=>{ const li=document.createElement('li'); li.className='cm'; li.onclick=()=>openDay(m.date);
    const teams = m.home||m.away ? `${m.home||'؟'} × ${m.away||'؟'}` : 'مباراة';
    li.innerHTML=`<div><b></b><small></small></div>${m.score?`<span class="sc">${num(m.score)}</span>`:'<span class="sc none">قيّم</span>'}`;
    li.querySelector('b').textContent=teams;
    li.querySelector('small').textContent=[fDm.format(parse(m.date)), m.comp, m.role!=null&&m.role!==''?ROLES[m.role]:''].filter(Boolean).join('، ');
    ul.appendChild(li); });
  box.appendChild(ul);
}

const CITIES={zulfi:{n:'الزلفي',lat:26.2994,lon:44.8154},riyadh:{n:'الرياض',lat:24.7136,lon:46.6753},majmaah:{n:'المجمعة',lat:25.9038,lon:45.3456}};
let WX=null;
async function loadWeather(){
  const c=CITIES[(state.settings&&state.settings.city)||'zulfi']||CITIES.zulfi;
  try {
    const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${c.lat}&longitude=${c.lon}&hourly=temperature_2m,apparent_temperature,relative_humidity_2m&forecast_days=2&timezone=Asia%2FRiyadh`);
    if(!r.ok) throw 0; const d=await r.json(); const t=todayISO(); const H={};
    d.hourly.time.forEach((tm,i)=>{ if(tm.startsWith(t)) H[+tm.slice(11,13)]={t:d.hourly.temperature_2m[i],f:d.hourly.apparent_temperature[i],h:d.hourly.relative_humidity_2m[i]}; });
    const win=[16,17,18,19,20,21,22,23].filter(x=>H[x]); if(!win.length) throw 0;
    const best=win.reduce((a,b)=>H[b].f<H[a].f?b:a), at18=H[18]||H[win[0]];
    WX={city:c.n,H,best,at18,hot:at18.f>=38};
  } catch(e){ WX=null; }
  renderWx(); renderAlerts();
}

const fMon = new Intl.DateTimeFormat(AR,{month:'long',year:'numeric'});
let monthSel=null;
function monthStats(ym){
  const [y,m]=ym.split('-').map(Number), start=`${ym}-01`, end=iso(new Date(y,m,0)), t=todayISO(), last = end<t?end:t;
  let planned=0, done=0, mins=0; const weeks={};
  for (let d=start; d<=last; d=addDays(d,1)){ const s=state.sessions[d], l=state.logs[d];
    if (s && !['rest','match'].includes(s.type)){ planned++; if(l&&l.done) done++; }
    if (l&&l.done){ const mn=l.dur ?? defDur(d,s); mins+=mn; const ws=addDays(d,-parse(d).getDay()); weeks[ws]=(weeks[ws]||0)+mn; } }
  const ms=state.matches.filter(x=>x.date>=start&&x.date<=last), sc=ms.map(x=>parseFloat(x.score)).filter(isFinite);
  const rd=Object.entries(state.readiness||{}).filter(([d])=>d>=start&&d<=last).map(([,r])=>readyScore(r));
  const Q=quizState(), qa=Object.values(Q.answers).filter(a=>a.date>=start&&a.date<=last), ex=(Q.exams||[]).filter(e=>e.date>=start&&e.date<=last);
  const coop=state.tests.filter(x=>x.kind==='cooper'&&x.date<=last).sort((a,b)=>a.date.localeCompare(b.date));
  return {ym, start, end, planned, done, adh: planned?Math.round(100*done/planned):0, mins, matches:ms.length, score: sc.length?sc.reduce((a,b)=>a+b,0)/sc.length:null,
    ready: rd.length?Math.round(rd.reduce((a,b)=>a+b,0)/rd.length/5*100):null, qn:qa.length, qacc: qa.length?Math.round(100*qa.filter(a=>a.ok).length/qa.length):null,
    exam: ex.length?Math.max(...ex.map(e=>Math.round(100*e.right/e.total))):null, cooper: coop.length?coop[coop.length-1].value:null, weeks};
}

    } catch(e){ out.innerHTML='<p class="note">تعذّر إنشاء الصورة.</p>'; } };

  x.strokeStyle='#FFD21F'; x.lineCap='round'; x.beginPath(); x.arc(cx,cy,R,-Math.PI/2,-Math.PI/2+Math.PI*2*S.adh/100); x.stroke();
  x.textAlign='center'; x.fillStyle='#fff'; x.font=F(700,52); x.fillText(`${num(S.done)}/${num(S.planned)}`,cx,cy+10); x.font=F(400,26); x.fillText('تمرين',cx,cy+50);
  // tiles
  const tiles=[['🏃','دقائق التدريب',num(Math.round(S.mins))],['🟨','مباريات',num(S.matches)],['⭐','متوسط التقييم',S.score!=null?num(S.score.toFixed(1)):'–'],
    ['💪','متوسط الجاهزية',S.ready!=null?num(S.ready)+'٪':'–'],['⚖️','دقة القانون',S.qacc!=null?num(S.qacc)+'٪':'–'],['📝','أفضل اختبار',S.exam!=null?num(S.exam)+'٪':'–']];
  tiles.forEach((tl,i)=>{ const col=i%2, row=Math.floor(i/2), tw=450, th=150, X=W-70-tw-col*(tw+40), Y=560+row*(th+26);
    x.fillStyle='rgba(16,40,28,.06)'; rr(X,Y+6,tw,th,30); x.fill(); x.fillStyle='#fff'; rr(X,Y,tw,th,30); x.fill();
    x.textAlign='right'; x.font=F(400,40); x.fillText(tl[0],X+tw-30,Y+62); x.fillStyle='#5E6B63'; x.font=F(400,30); x.fillText(tl[1],X+tw-90,Y+60);
    x.fillStyle='#1E6A43'; x.font=F(700,60); x.fillText(tl[2],X+tw-30,Y+125); });
  // weekly minutes bars
  const wk=Object.entries(S.weeks).sort(), mx=Math.max(60,...wk.map(w=>w[1])); const bx0=70, bw=W-140, by=1255, bh=100;

/* ---------- weekly report ---------- */
function weekSummary(ws){
  let planned=0,done=0,load=0,matches=[],ready=[],efforts=[];
  for(let i=0;i<7;i++){ const d=addDays(ws,i), s=state.sessions[d], l=state.logs[d];
    if (s && !['rest','match'].includes(s.type)){ planned++; if(l&&l.done){done++; if(l.effort) efforts.push(l.effort);} }
    if (s && s.type==='match') matches.push({date:d, ...(l||{})});
    load+=dayLoad(d); if(state.readiness[d]) ready.push(readyScore(state.readiness[d])); }
  const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
  return {planned,done,load,matches,ready:avg(ready),effort:avg(efforts)};
}
let reportBusy=false, reportWeek=null;
async function genReport(ws){
  reportWeek=ws;
  if (!sampleFn || reportBusy){ renderReport(); return; }
  reportBusy=true; renderReport();
  const sum=weekSummary(ws), days={};
  for(let i=0;i<7;i++){ const d=addDays(ws,i); days[d]={session:state.sessions[d]?.title, type:state.sessions[d]?.type, log:state.logs[d]||null, readiness:state.readiness[d]||null}; }
  const next={}; for(let i=7;i<14;i++){ const d=addDays(ws,i); if(state.sessions[d]) next[d]=state.sessions[d].title; }
  const prompt=`أنت مدرب لياقة لحكم كرة قدم مساعد في السعودية. اكتب له تقرير أسبوعي قصير بالعربي بلهجة سعودية بسيطة، أقل من ١٢٠ كلمة، بدون مقدمة، بثلاثة أقسام بعناوين قصيرة:
وش أنجزت
وش انتبه له
تركيزك هالأسبوع (نقطتين عمليتين)
الجهد من ١ إلى ٥، والجاهزية من ١ إلى ٥، والحمل = المدة × الجهد. حالة الرجلين بالمباريات من ١ (مرتاحة) إلى ٥ (منهكة)، والشوط ٣ يعني تعب بالشوط الثاني.
الملخص: ${JSON.stringify(sum)}
الأيام: ${JSON.stringify(days)}
الأسبوع الجاي: ${JSON.stringify(next)}
حالة الحمل: ${JSON.stringify(loadStatus())}`;
  try { const r=await sampleFn(prompt,{cache:false}); state.reports[ws]={text:r.text.trim(),at:todayISO()}; save(); }
  catch(e){ state.reports[ws]=state.reports[ws]||null; reportErr = e?.code==='rate_limited'?'وصلت الحد المسموح، جرّب بعد شوي.':'تعذّر إنشاء التقرير، جرّب مرة ثانية.'; }
  finally { reportBusy=false; renderAll(); }
}
let reportErr='';
function renderReport(){
  const box=$('reportPanel'), t=todayISO(), dow=parse(t).getDay();
  const ws = reportWeek || addDays(t,-dow-7);
  const sum=weekSummary(ws), rep=state.reports[ws];
  box.innerHTML=`<h3>تقرير أسبوع ${fDm.format(parse(ws))}</h3>
    <p class="note">${num(sum.done)} من ${num(sum.planned)} تمارين، ${num(sum.matches.length)} ${sum.matches.length===1?'مباراة':'مباريات'}، الحمل ${num(Math.round(sum.load))}${sum.ready?`، متوسط الجاهزية ${num(Math.round(sum.ready/5*100))}٪`:''}</p>`;
  if (reportBusy){ box.insertAdjacentHTML('beforeend','<div class="report">المدرب يكتب التقرير…</div>'); return; }

  if (reportErr){ const e=document.createElement('p'); e.className='note'; e.style.color='var(--red)'; e.textContent=reportErr; box.appendChild(e); reportErr=''; }

  if (sampleFn){ const b=document.createElement('button'); b.className='btn primary sm'; b.style.marginTop='0'; b.textContent=rep?'حدّث التقرير':'أنشئ التقرير'; b.onclick=()=>genReport(ws); row.appendChild(b); }
  const prev=document.createElement('button'); prev.className='btn ghost sm'; prev.style.marginTop='0'; prev.textContent='الأسبوع اللي قبله'; prev.onclick=()=>{ reportWeek=addDays(ws,-7); renderReport(); }; row.appendChild(prev);
  if (ws < addDays(t,-dow)){ const nx=document.createElement('button'); nx.className='btn ghost sm'; nx.style.marginTop='0'; nx.textContent='اللي بعده'; nx.onclick=()=>{ reportWeek=addDays(ws,7); renderReport(); }; row.appendChild(nx); }
  box.appendChild(row);
}
