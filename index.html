  box.appendChild(ul);
  if (secondHalf>=2 || heavy>=2){ const p=document.createElement('p'); p.className='note'; p.style.marginTop='8px';
    p.textContent = secondHalf>=2 ? 'تتعب بالشوط الثاني بشكل متكرر. تمارين تحمّل الحكم المساعد يوم السبت هي أهم شي لك.' : 'رجولك تطلع ثقيلة بعد أكثر من مباراة. ركّز على تمرين القوة والاستشفاء بعد المباريات.'; box.appendChild(p); }
}

/* ---------- chat ---------- */
let sampleFn = null, busy = false, ctl = null;
const RULES = `أنت مدرب لياقة شخصي وصديق لحكم كرة قدم مساعد (حكم خط) في السعودية اسمه سعود. تكلم بلهجة سعودية دافئة ومشجعة مثل صديق يهتم فيه: رحّب فيه حسب الوقت، اسأله أحيانًا عن حاله ويومه، امدح التزامه، وطمّنه إذا تعبان. لا تطوّل ولا تكون رسمي، وإيموجي واحد أو اثنين بالرد يكفي. حركته بالمباراة: خطوات جانبية على خط التماس، سرعات قصيرة ١٠–٣٠ م، ركض للخلف، وتغيير اتجاه سريع مع خط التسلل. معلومات ثابتة عنه:
- يتمرن ٤ أيام بالأسبوع في البيت والشارع، بدون نادي ولا أوزان.
- مبارياته متغيرة: أحيانًا وحدة بالأسبوع، أحيانًا ولا وحدة، وأحيانًا اثنتين، غالبًا الجمعة أو السبت.
- أكثر شي يتعبه: الرجلين والعضلات، خصوصًا بالحر.
- لا توجد إصابات.
- الهدف: يحافظ على لياقته طول الموسم ويحكم المباريات وينهيها بدون تعب. ما عنده اختبار لياقة قادم.

قواعد التعديل:
- اليوم اللي بعد المباراة استشفاء، واليوم اللي قبلها خفيف. لا تحط يومين صعبين ورا بعض.
- حافظ على ٤ تمارين بالأسبوع قدر الإمكان، وأولوية التمارين: سرعات الحكم المساعد والخطوات الجانبية، ثم الارتدادات ورد الفعل، ثم قوة الرجلين، ثم التحمل.
- الخطة مستمرة: كل رابع أسبوع خفيف للاستشفاء. إذا تراكمت مباريات كثيرة، خفّف أكثر.
- إذا قال إنه تعبان أو رجوله ثقيلة، خفّف ولا تضغط. خذ بعين الاعتبار سجل إحساسه بالتمارين، وجاهزيته الصباحية (١ سيء إلى ٥ ممتاز)، وتقييم مبارياته، ونسبة الحمل (فوق ١٫٥ يعني خطر إرهاق).
- عدّل فقط الأيام اللي تحتاج تعديل، ولا تغيّر أيام مضت.
- اذكر نسبة الجهد في كل تمرين: تحمّل ٦٠–٧٠٪، سرعات ٩٠٪، تحمّل المساعد ٨٠–٨٥٪، تنشيط واستشفاء ٥٠٪ أو أقل.
- التمارين بوزن الجسم فقط، وقابلة للتنفيذ بالشارع أو البيت.

ردّك دائمًا كائن JSON واحد فقط بهذا الشكل:
{"reply":"رد قصير بالعربي يوضح وش غيّرت وليش","sessions":[{"date":"YYYY-MM-DD","type":"run|strength|intervals|yoyo|light|rest|recovery|test|match","title":"عنوان قصير","details":"تفاصيل التمرين"}],"addMatches":[{"date":"YYYY-MM-DD","time":"HH:MM أو فارغ","note":""}],"removeMatchDates":["YYYY-MM-DD"]}
اترك المصفوفات فارغة إذا ما فيه تغيير. إذا ذكر مباراة جديدة، ضعها في addMatches. التاريخ بالأرقام الإنجليزية دائمًا.`;

function context(){
  const t = todayISO(), from = addDays(t,-3), to = addDays(t,28);
  const sessions = Object.fromEntries(Object.entries(state.sessions).filter(([d])=>d>=from&&d<=to).sort());
  const logs = Object.fromEntries(Object.entries(state.logs).filter(([d])=>d>=addDays(t,-14)));
  return JSON.stringify({today:t, weekday:fWd.format(parse(t)), now:new Date().toTimeString().slice(0,5), sessions, matches:state.matches.filter(m=>m.date>=addDays(t,-14)), recentLogs:logs, tests:state.tests, readiness:Object.fromEntries(Object.entries(state.readiness).filter(([d])=>d>=addDays(t,-7))), load:loadStatus(), weather:WX?{city:WX.city,feelsAt18:WX.at18.f,bestHour:WX.best,bestFeels:WX.H[WX.best].f}:null});
}
function renderChat(){
  const box = $('msgs'); box.innerHTML='';
  if (!state.chat.length){
    const p=document.createElement('p'); p.className='empty';
    p.textContent = sampleFn ? greet(new Date().getHours())+'\nقولي وش عندك اليوم، مباراة؟ تعب؟ أي شي، وأنا أرتب جدولك على حسبه.' : 'المدرب غير متاح حاليًا. تأكد من الاتصال بالإنترنت.';
    box.appendChild(p);
  }
  state.chat.forEach(m => {
    const d=document.createElement('div'); d.className='msg '+(m.role==='user'?'me':'ai')+(m.err?' err':'');
    d.textContent = m.content;
    if (m.changes){ const c=document.createElement('span'); c.className='chg'; c.textContent=m.changes; d.appendChild(c); }
    box.appendChild(d);
  });
  if (busy){ const d=document.createElement('div'); d.className='msg ai'; d.textContent='يفكر…'; box.appendChild(d); }
  $('sendBtn').textContent = busy ? 'إيقاف' : 'إرسال';
  $('composer').hidden = $('chat').hidden || !sampleFn;
  if (!$('chat').hidden) requestAnimationFrame(()=>window.scrollTo(0,document.body.scrollHeight));
}
const DATE_RE = /^\d{4}-\d{2}-\d{2}$/;
function applyChanges(r){
  let n = 0;
  (Array.isArray(r.removeMatchDates)?r.removeMatchDates:[]).forEach(d=>{ if (DATE_RE.test(d)){ removeMatch(d); n++; } });
  (Array.isArray(r.addMatches)?r.addMatches:[]).forEach(m=>{ if (m && DATE_RE.test(m.date) && !state.matches.some(x=>x.date===m.date)){ applyMatch(m.date,String(m.time||''),String(m.note||'')); n++; } });
  const t = todayISO();
  (Array.isArray(r.sessions)?r.sessions:[]).forEach(s=>{
    if (!s || !DATE_RE.test(s.date) || s.date < t || !TYPES[s.type]) return;
    state.sessions[s.date] = {type:s.type, title:String(s.title||TYPES[s.type].l).slice(0,80), details:String(s.details||'').slice(0,800)}; n++;
  });
  return n;
}
async function send(text){
  if (!sampleFn || busy || !text.trim()) return;
  state.chat.push({role:'user', content:text.trim()});
  busy = true; renderChat();
  const hist = state.chat.slice(-11,-1).filter(m=>!m.err).map(m=>({role:m.role, content:m.content}));
  const turns = [{role:'user',content:RULES}, ...hist, {role:'user',content:`بيانات الجدول الحالية:\n${context()}\n\nرسالة الحكم: ${text.trim()}`}];
  ctl = new AbortController();
  try {
    const r = await sampleFn.json(turns, {cache:false, signal:ctl.signal});
    const n = applyChanges(r || {});
    state.chat.push({role:'assistant', content:String(r?.reply||'تم.'), changes: n?`عدّلت ${num(n)} ${n===1?'يوم':'أيام'} في الجدول`:''});
  } catch(e){
    const msg = {cancelled:'أوقفت الرد.', rate_limited:'وصلت الحد المسموح حاليًا. جرّب بعد شوي.', not_granted:'ما تم السماح للصفحة باستخدام Claude.', invalid_json:'الرد وصل بشكل غير مفهوم. أعد الإرسال.', session_expired:'سجّل دخولك مرة ثانية.'}[e?.code] || 'صار خطأ بالاتصال. أعد الإرسال.';
    state.chat.push({role:'assistant', content:msg, err:true});
    if (e?.code==='not_granted' || e?.code==='sampling_disabled') sampleFn = null;
  } finally { busy=false; ctl=null; save(); renderAll(); }
}
$('sendBtn').onclick = () => { if (busy){ ctl?.abort(); return; } const v=$('chatIn').value; $('chatIn').value=''; send(v); };
$('chatIn').addEventListener('keydown', e => { if (e.key==='Enter' && !e.shiftKey && window.matchMedia('(pointer:fine)').matches){ e.preventDefault(); $('sendBtn').click(); } });
['عندي مباراة بكرة','رجولي تعبانة اليوم','فاتني تمرين أمس','عندي مباراتين هالأسبوع','الجو حار جدًا اليوم','وش أسوي قبل المباراة؟'].forEach(t=>{
  const b=document.createElement('button'); b.textContent=t; b.onclick=()=>{ $('chatIn').value=t; $('chatIn').focus(); }; $('chips').appendChild(b);
});

/* ---------- tabs + boot ---------- */
function switchTab(id){
  document.querySelectorAll('nav.tabs button').forEach(b=>b.setAttribute('aria-selected', b.dataset.tab===id));
  ['sched','chat','prog'].forEach(s=>$(s).hidden = s!==id);
  renderChat(); if (id==='sched') scrollToday(); else window.scrollTo(0, id==='chat'?document.body.scrollHeight:0);
}
document.querySelectorAll('nav.tabs button').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));
function scrollToday(){ const t=todayISO(), cur=addDays(t,-parse(t).getDay()); if (viewWeek!==cur){ viewWeek=cur; renderSchedule(); } const r=$('todayRow'); if (r) r.scrollIntoView({block:'center'}); }
$('todayBtn').onclick = scrollToday;
document.querySelectorAll('#progSeg button').forEach(b=>b.onclick=()=>{ document.querySelectorAll('#progSeg button').forEach(x=>x.setAttribute('aria-pressed',x===b)); document.querySelectorAll('#prog .pg').forEach(g=>g.hidden=g.dataset.g!==b.dataset.g); window.scrollTo({top:0}); });
$('timer').querySelector('button').onclick = () => stopTimer(false);
$('addMatchBtn').onclick = openAddMatch;
$('addTestBtn').onclick = openAddTest;
$('expBtn').onclick = () => { const blob=new Blob([JSON.stringify(state)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='referee-backup-'+todayISO()+'.json'; document.body.appendChild(a); a.click(); a.remove(); };
$('impBtn').onclick = () => $('impFile').click();
$('impFile').onchange = async e => { const f=e.target.files[0]; if(!f) return; try { const d=JSON.parse(await f.text()); if(!d.sessions) throw 0; adopt(d); ensureHorizon(); save(); renderAll(); alert('تم استيراد بياناتك ✅'); } catch(_){ alert('الملف غير صالح'); } e.target.value=''; };
$('citySel').onchange = e => { state.settings = {...(state.settings||{}), city:e.target.value}; save(); loadWeather(); };
function renderAll(){
  const t = todayISO();
  const next = state.matches.filter(m=>m.date>=t).sort((a,b)=>a.date.localeCompare(b.date))[0];
  const nm=$('nextm'); $('hiDate').textContent = fFull.format(parse(t));
  if (next){
    const days = Math.round((parse(next.date)-parse(t))/864e5);
    nm.className='nextm'; nm.innerHTML = `<span class="card-ic"></span>${days===0?'<span class="big">اليوم</span>':`<span class="big">${num(days)}</span>`}<span class="tx">${days===0?'عندك مباراة':(days===1?'يوم على مباراتك':'أيام على مباراتك')}<small>${fFull.format(parse(next.date))}${next.time?' الساعة '+next.time:''}</small></span>`;
  } else { nm.className='nextm none'; nm.innerHTML = '<span class="card-ic"></span><span class="tx">ما فيه مباراة قادمة<small>إذا نزلت لك مباراة أضفها من الزر تحت</small></span>'; }
  renderHero();
  renderReady(); renderQuiz(); renderAlerts(); renderSchedule(); renderCareer(); renderLaw(); renderMonth(); renderProgress(); renderReport(); renderLoad(); renderMatches(); renderChat();
}
ensureHorizon(); renderAll(); requestAnimationFrame(scrollToday);
initStorage().then(()=>{ loadInbox(); requestAnimationFrame(scrollToday); $('citySel').value=(state.settings&&state.settings.city)||'zulfi'; loadWeather(); });
claude.use('sample').then(s => { sampleFn = s; renderAll(); }).catch(()=>{});
})();
</script>
