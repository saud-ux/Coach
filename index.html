<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>جدول الحكم</title>
<meta name="description" content="جدول تمارين ومدرب لياقة للحكم المساعد">
<meta name="theme-color" content="#0A4A2C">
<!-- Night or day before the first paint, so the page never flashes the wrong
     theme. Same rule as applyTheme() in js/ui.js: the setting wins, and "auto"
     (the default) is night from 18:00 to 05:00. -->
<script>
(function(){ var p='auto'; try{ p=((JSON.parse(localStorage.getItem('referee-coach-v1')||'{}').settings)||{}).theme||'auto'; }catch(e){}
  var h=new Date().getHours(); if(p==='night'||(p!=='day'&&(h>=18||h<5))) document.documentElement.setAttribute('data-theme','night'); })();
</script>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="جدول الحكم">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<!-- ?v= marks a file as immutable to the server, so bump it in index.html, sw.js
     and server.js together when any css changes -->
<link rel="stylesheet" href="/css/tokens.css?v=23">
<link rel="stylesheet" href="/css/app.css?v=23">

<!-- loaded without blocking the first paint: text appears in the system fallback
     and swaps when the webfont lands -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@600;700;800&display=swap">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@600;700;800&display=swap"></noscript>

<!-- No ?v= here, deliberately. The modules import each other by bare path, and a
     query string makes a DIFFERENT module identity: with ?v= on this tag the browser
     loaded main.js twice and the second copy booted mid-evaluation. js/ is served
     no-cache instead and the service worker does the real caching. -->
<script type="module" src="/js/main.js"></script>
</head>
<body>

<p id="status" role="status" aria-live="polite"></p>

<main class="wrap">

  <!-- ===== اليوم ===== -->
  <section id="today" aria-label="اليوم">
    <header class="thead tband">
      <div class="thtop">
        <div>
          <p class="tdate" id="todayDate"></p>
          <h1 id="todayHello">اليوم</h1>
        </div>
        <button class="iconbtn" id="gearBtn" aria-label="الإعدادات"></button>
      </div>
      <div class="bchips" id="bandChips"></div>
      <div class="bweek" id="bandWeek"></div>
    </header>
    <div id="sleepCard"></div>
    <div id="watchCard"></div>
    <div id="sessionCard"></div>
    <div id="wxLine" class="wxline" hidden></div>
    <div id="nextMatchLine"></div>
  </section>

  <!-- ===== الجدول ===== -->
  <section id="sched" hidden aria-label="الجدول">
    <header class="thead">
      <div><p class="tdate">خطتك الأسبوعية</p><h1>الجدول</h1></div>
      <button class="iconbtn" id="addMatchBtn" aria-label="أضف مباراة"></button>
    </header>
    <div id="inbox"></div>
    <div id="weeks"></div>
  </section>

  <!-- ===== المدرب ===== -->
  <section id="chat" hidden aria-label="المدرب">
    <header class="thead">
      <div><p class="tdate">يرتّب جدولك معك</p><h1>المدرب</h1></div>
    </header>
    <div id="alerts"></div>
    <div class="msgs" id="msgs"></div>
  </section>

  <!-- ===== التقدم ===== -->
  <section id="prog" hidden aria-label="التقدم">
    <header class="thead">
      <div><p class="tdate">وين وصلت</p><h1>التقدم</h1></div>
    </header>
    <div class="seg" id="progSeg" role="tablist">
      <button data-g="ov" aria-pressed="true">نظرة عامة</button>
      <button data-g="mt" aria-pressed="false">المباريات</button>
      <button data-g="law" aria-pressed="false">القانون</button>
    </div>

    <div class="pg" data-g="ov">
      <div class="stats" id="stats"></div>
      <div class="panel" id="loadPanel"></div>
      <div class="panel" id="reportPanel"></div>
      <div class="panel" id="monthPanel"></div>
      <div class="panel">
        <div class="phead"><h3>اختبار 12 دقيقة</h3><button class="chip" id="addTestBtn">سجّل نتيجة</button></div>
        <div id="chartCooper"></div>
        <ul class="tlist" id="listCooper"></ul>
      </div>
    </div>

    <div class="pg" data-g="mt" hidden>
      <div class="panel" id="careerPanel"></div>
      <div class="panel" id="matchPanel"></div>
    </div>

    <div class="pg" data-g="law" hidden>
      <div id="quiz"></div>
      <div class="panel" id="lawPanel"></div>
    </div>
  </section>

</main>

<div class="composer" id="composer" hidden>
  <div class="in-wrap">
    <div class="chips" id="chips"></div>
    <div class="send">
      <textarea class="in" id="chatIn" rows="1" placeholder="اكتب للمدرب…"></textarea>
      <button class="btn primary sendbtn" id="sendBtn">إرسال</button>
    </div>
  </div>
</div>

<nav class="tabs" role="tablist" aria-label="التنقل">
  <button role="tab" data-tab="today" aria-selected="true"><span class="tabic"></span><span>اليوم</span></button>
  <button role="tab" data-tab="sched" aria-selected="false"><span class="tabic"></span><span>الجدول</span></button>
  <button role="tab" data-tab="chat"  aria-selected="false"><span class="tabic"></span><span>المدرب</span></button>
  <button role="tab" data-tab="prog"  aria-selected="false"><span class="tabic"></span><span>التقدم</span></button>
</nav>

<div id="timer" hidden><span class="tv"></span><span class="tl"></span><button>إيقاف</button></div>
<div class="scrim" id="scrim" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>

</body>
</html>
