name: RefereeCoach
options:
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    PRODUCT_BUNDLE_IDENTIFIER: com.saud.refereecoach
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: '1'
targets:
  RefereeCoach:
    type: application
    platform: iOS
    sources: [Coach]
    info:
      path: Coach/Info.plist
      properties:
        CFBundleDisplayName: جدول الحكم
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [location]
        NSLocationWhenInUseUsageDescription: نسجّل مسافة ومسار الجري عندما تبدأ تمرينًا.
        NSLocationAlwaysAndWhenInUseUsageDescription: يستمر تسجيل تمرين الجري عند قفل الشاشة.
        NSHealthShareUsageDescription: نستورد التمارين والنوم والنبض والخطوات لتحسين خطتك، بعد اختيارك للبيانات المسموحة.
    entitlements:
      path: Coach/Coach.entitlements
      properties:
        com.apple.developer.healthkit: true
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
schemes:
  RefereeCoach:
    build:
      targets:
        RefereeCoach: all
